name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Rilancio manuale (es. dopo un fix di configurazione del repo, senza aspettare un push).
  workflow_dispatch:

jobs:
  engine:
    name: Engine + Electron-module tests
    # Windows in matrice: la classe di bug specifica di Windows esiste davvero (assert
    # libuv del watcher sui percorsi corti 8.3, luglio 2026) e su un runner solo-Linux
    # resterebbe invisibile per costruzione.
    strategy:
      # Un rosso su un OS non deve cancellare l'altro leg: il segnale Windows
      # serve proprio quando Linux fallisce (e viceversa).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:versions
        if: matrix.os == 'ubuntu-latest'
      - run: npm test
        if: matrix.os == 'ubuntu-latest'
      # Il leg Windows esiste per la classe di bug del backend (watcher/libuv): le suite
      # electron girano una volta sola, su ubuntu, senza raddoppiare i minuti Windows.
      - run: npm run test:backend
        if: matrix.os == 'windows-latest'

  ui:
    name: UI tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mockxy-ui/package-lock.json
      - run: npm --prefix mockxy-ui ci
      - run: npm --prefix mockxy-ui test -- --watch=false
      - run: npm --prefix mockxy-ui run build

  # Gli e2e giravano solo nella workflow di release, al tag: un test che dipendeva dal font di
  # sistema e' emerso solo allora, e la 1.7.0 non e' uscita. Qui girano a ogni PR e push su main,
  # sul runner Ubuntu e col suo font, come in release; la release li ripete prima dei pacchetti.
  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mockxy-ui/package-lock.json
      - run: npm ci
      - run: npm --prefix mockxy-ui ci
      - name: Installa Chromium per gli E2E
        run: npx playwright install --with-deps chromium
      # Compila la UI desktop e lancia la suite (con 2 nuovi tentativi in CI, da playwright.config.js).
      - run: npm run test:e2e
      - name: Report E2E (solo su fallimento)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
