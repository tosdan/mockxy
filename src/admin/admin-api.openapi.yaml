# Mockxy Admin API — OpenAPI description.
#
# Hand-written from the route table in src/admin/admin-api.js and the operations it delegates to.
# When a route changes, this file changes with it: it is the machine-readable twin of
# docs/{it,en}/ADMIN-API.md, which stays the prose reference. It lives next to the router because
# the running engine serves it (GET /_admin/api/openapi.yaml) from every package that ships src/:
# a checkout, the desktop app and the development Docker image.
openapi: 3.1.0

info:
  title: Mockxy Admin API
  version: 1.2.0
  summary: Control surface of a running Mockxy mock server — catalog, response variants, collections, data files, traffic monitor and runtime switches.
  description: |
    Every action of the Mockxy UI is a call to this API: there is nothing the interface can do
    that a script or an agent cannot. Typical uses are seeding a workspace, resetting state
    between e2e tests, importing an updated OpenAPI spec in CI, or inspecting captured traffic.

    ## Mental model

    A Mockxy workspace is a folder tree of files, and this API is a typed editor for it:

    - An **endpoint** is one HTTP method on one route path. On disk it is a
      `METHOD.endpoint.json` file; its route path is derived from the folder that contains it and
      is therefore **immutable after creation** (copy the endpoint to move it).
    - An endpoint owns one or more **response variants** (`NNN.response.json` inside
      `METHOD.responses/`). Exactly one is *selected* and answers requests. A `sequence`
      variant walks other variants request after request; selecting it is the only way to
      activate that scenario.
    - A variant has a `type` that decides how the endpoint answers:
      `mock` (static payload, optionally templated or file-backed), `handler` (JS module that
      computes the response), `middleware` (JS module that transforms a proxied backend
      response), `sse` (Server-Sent Events script), `ws` (WebSocket script + rules), or
      `sequence` (an ordered scenario of `mock`/`handler` variants).
    - **Collections** are a presentation tree over endpoints (labels, nesting, ordering); they
      live in `.collections.json` and never change how a request is served — except for the bulk
      enable/disable operation, which rewrites the endpoints themselves.
    - **Data files** are reusable JSON documents that handlers and middleware read through the
      `data("name")` accessor.

    ## Conventions

    - **Base path**: every route below is relative to `/_admin/api`.
    - **Endpoint `id`**: the endpoint file path, relative to the mocks folder, base64url-encoded.
      Obtain it from a listing and treat it as **opaque**; it changes when the endpoint moves.
    - **Errors**: JSON `{ error, message, details? }` with a matching status —
      `400` invalid input, `403` host guard, `404` not found, `409` conflict,
      `415` unsupported media type, `500` unexpected failure. Newer errors carry a stable
      `details.code` so a client does not have to parse the message.
    - **Reserved namespace**: a method or path under `/_admin/api` that is not described here
      answers `404` with `details.code: "ADMIN_ROUTE_NOT_FOUND"`. It never falls through to mock
      serving or to the backend proxy, and a mock declared under `/_admin/api` is never served,
      WebSocket upgrades included.
    - **Reload semantics**: catalog mutations reload the runtime *before responding* and check
      the outcome, so the change is live for the very next request — no restart. A `2xx` means
      the files are written **and** the installed runtime reflects the requested effect on the
      endpoints involved: served when enabled, gone when disabled or deleted. A load error on
      those endpoints, a failed runtime reload or a write error undoes the change and answers
      with `details.code` and `details.rollback` (see the `BadRequest` and `MutationFailed`
      responses); errors of unrelated endpoints do not fail a valid mutation. There is no
      isolation from traffic while a mutation runs: the guarantee is a consistent state at the
      end. Data-file writes reload nothing (`data()` re-reads on every call), with one
      exception: a rename that rewrites `data()` references in handler sources does reload, and
      the rewritten handlers are checked the same way.
    - **One mutation at a time**: mutations of the same workspace are serialized. Reads, served
      traffic and the SSE/WS console pushes are not queued behind them, and a client that
      disconnects does not cut a running mutation short.
    - **Mutation results**: most endpoint and variant mutations answer with the **full
      `MockDetail`** of the affected endpoint, so a client never needs a follow-up GET. Composing
      that detail happens *after* the change is committed, so when it fails for an unrelated
      reason (unreadable selected variant, asset removed by hand) the mutation is **not** undone
      and **not** reported as an error: the answer is `MockDetailUnavailable`, a success carrying
      the reason instead of the description.
    - **Body limits**: JSON bodies are capped at 2 MB, raw uploads at 12 MB (response assets,
      OpenAPI documents) and 25 MB (data files).

    ## Security

    There is **no authentication**. This API writes files and executes JavaScript, so it is a
    development tool for a trusted machine, not a public surface:

    - It is enabled by `ADMIN_API_ENABLED` (default: on outside production). When disabled,
      every route answers `404` with an explicit message.
    - When the server is bound to loopback (the default) a **DNS-rebinding guard** rejects
      requests whose `Host` header is not a loopback name — additional names go in
      `ADMIN_ALLOWED_HOSTS`. Requests to the mocks themselves are never filtered.
    - Mutations require an explicit JSON content type, which is also the CSRF defense: a
      cross-origin request carrying `application/json` triggers a preflight and dies there. The
      OpenAPI import accepts YAML too but rejects `text/plain` with `415` for the same reason.

    ## What this document does not cover

    The **mocked traffic itself**. Everything outside `/_admin/api` (and `/_admin/ui`, the
    compiled interface) is matched against the catalog: a hit is served by the matching variant,
    a miss falls through to the configured backend, or answers `404` when proxy fallback is off.
    Those routes are defined by the workspace, not by Mockxy, so they cannot be described here.
    Responses carry an `x-mock-source` header telling you which branch answered — see
    `MonitorEntry.source` for the possible values.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
  contact:
    name: Mockxy
    url: https://github.com/tosdan/mockxy

externalDocs:
  description: Prose reference for this API (Italian and English)
  url: https://github.com/tosdan/mockxy/blob/main/docs/en/ADMIN-API.md

servers:
  - url: http://{host}:{port}/_admin/api
    description: A running Mockxy server (loopback by default)
    variables:
      host:
        default: localhost
      port:
        default: "3000"

tags:
  - name: Catalog
    description: Read the endpoint catalog and resolve a concrete request to the endpoint that covers it.
  - name: Endpoints
    description: Create, update, copy and delete endpoints, plus their runtime actions (sequence reset, SSE/WS consoles).
  - name: Response variants
    description: Add, edit and remove the response variants an endpoint can serve.
  - name: Collections
    description: The presentation tree over endpoints — labels, nesting, ordering, bulk enable/disable.
  - name: OpenAPI import
    description: Turn an OpenAPI document into mock endpoints, with a dry-run planning mode.
  - name: Data files
    description: Reusable JSON documents that handlers and middleware read through `data("name")`.
  - name: Monitoring
    description: Live request feed, its durable NDJSON archive, and mock creation from captured traffic.
  - name: Server state
    description: Runtime switches that decide whether mocks are used at all.
  - name: Shared runtime state
    description: Metadata and reset actions for named JSON resources shared by local handlers. Values are never exposed.
  - name: Runtime
    description: The running engine itself — its identity, its effective configuration, the outcome of its loads and the contract of the version that answers.

paths:
  # ───────────────────────────────── Catalog ─────────────────────────────────
  /mocks:
    get:
      tags: [Catalog]
      operationId: listMocks
      summary: The whole catalog
      description: |
        Returns every endpoint with a summary of its **selected** variant, the collection tree,
        the unified child ordering used to render it, and the endpoints that could not be read.

        An unreadable endpoint file (invalid JSON, missing selected variant) never fails the
        request: it is skipped and reported in `loadErrors`, exactly as the runtime loader does.
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                type: object
                required: [items, collections, childOrder, loadErrors]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MockSummary" }
                    description: Endpoints, ordered as the UI shows them.
                  collections:
                    type: array
                    items: { $ref: "#/components/schemas/CollectionSummary" }
                    description: Persisted collections in depth-first display order.
                  childOrder: { $ref: "#/components/schemas/ChildOrder" }
                  loadErrors:
                    type: array
                    description: Endpoint files that could not be read, and why.
                    items:
                      type: object
                      required: [configFilePath, message]
                      properties:
                        configFilePath:
                          type: string
                          description: Path of the endpoint file, relative to the mocks folder.
                        message: { type: string }
        "404": { $ref: "#/components/responses/AdminApiDisabled" }
    post:
      tags: [Endpoints]
      operationId: createMock
      summary: Create an endpoint
      description: |
        Creates an endpoint together with its first variant. The route path determines the
        folder the files land in, so **method + path must be free**: an existing endpoint answers
        `409` and reports its id in `details.existingMockId`, which lets a client offer "add this
        as a variant of the existing endpoint" instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMockRequest" }
            examples:
              staticMock:
                summary: Static JSON mock
                value:
                  config:
                    method: GET
                    path: /api/users
                    status: 200
                    headers: { content-type: application/json }
                    delayMs: 0
                  body:
                    - { id: 1, name: Ada }
                    - { id: 2, name: Linus }
              handler:
                summary: Dynamic handler (source omitted → template scaffold)
                value:
                  type: handler
                  definition: { method: POST, path: /api/login }
      responses:
        "201":
          description: The created endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockDetailAfterMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: An endpoint already exists for this method and path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: Conflict
                message: An endpoint already exists for this folder and method.
                details: { existingMockId: bW9ja3MvYXBpL3VzZXJzL0dFVC5lbmRwb2ludC5qc29u }
        "500": { $ref: "#/components/responses/MutationFailed" }

  /mocks/resolve:
    get:
      tags: [Catalog]
      operationId: resolveMock
      summary: Which endpoint would cover this request
      description: |
        Answers "if this concrete request arrived now, which catalog entry would it belong to?".
        The matching mirrors the serving semantics (exact routes before dynamic ones,
        specificity, declared query parameters) but runs over the **whole** catalog, disabled
        endpoints included — the use case is "take me to the mock", not "who would answer".

        A derived fact, computed on the fly and never persisted: the monitor entry stays the
        pure historical record.
      parameters:
        - name: method
          in: query
          required: true
          schema: { $ref: "#/components/schemas/HttpMethod" }
        - name: path
          in: query
          required: true
          description: Absolute request path; a query string may be included and is used by routes that declare query parameters.
          schema: { type: string }
          example: /api/users/42?expand=true
      responses:
        "200":
          description: The covering endpoint, or `null` when none matches.
          content:
            application/json:
              schema:
                type: object
                required: [mock]
                properties:
                  mock:
                    oneOf:
                      - { $ref: "#/components/schemas/MockSummary" }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ─────────────────────────────── Collections ───────────────────────────────
  /mocks/collections:
    post:
      tags: [Collections]
      operationId: createCollection
      summary: Create a collection
      description: |
        Creates a collection, optionally nested under another one. Labels are compared
        case- and accent-insensitively among siblings, and the reserved label of the virtual
        `Unsorted` bucket is rejected. New sub-collections land at the top of their parent;
        new top-level collections are appended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                parentId:
                  type: string
                  description: Parent collection id; omit for a top-level collection. `unsorted` is not a valid parent.
            example: { label: Authentication }
      responses:
        "201":
          description: The created collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Parent collection not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The label is reserved, or already used by a sibling.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mocks/collections/order:
    patch:
      tags: [Collections]
      operationId: reorderCollections
      summary: Reorder sibling collections
      description: Sets the order of the collections that share one parent. The list must contain each sibling **exactly once**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collectionIds]
              properties:
                collectionIds:
                  type: array
                  items: { type: string }
                  description: Persisted collection ids, in the desired order.
                parentId:
                  type: string
                  description: Scope of the reordering; omit for the top level.
      responses:
        "200": { $ref: "#/components/responses/CollectionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/CollectionNotFound" }

  /mocks/collections/{id}/parent:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    patch:
      tags: [Collections]
      operationId: reparentCollection
      summary: Move a collection in the tree
      description: |
        Re-parents a collection (omit `parentId` to move it to the top level) and optionally
        places it at a given index among its new siblings. Cycles are rejected: a collection
        cannot become a child of itself or of one of its descendants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentId:
                  type: [string, "null"]
                  description: New parent; `null`/absent means top level. `unsorted` is not a valid parent.
                targetIndex:
                  type: integer
                  minimum: 0
                  description: Position among the new siblings; appended when absent.
      responses:
        "200": { $ref: "#/components/responses/CollectionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/CollectionNotFound" }
        "409":
          description: A sibling already uses this label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mocks/collections/{id}/items/order:
    parameters:
      - $ref: "#/components/parameters/CollectionIdWithUnsorted"
    patch:
      tags: [Collections]
      operationId: reorderCollectionItems
      summary: Reorder the endpoints of a collection
      description: Sets the order of the endpoints inside one collection. The list must contain each endpoint of that collection **exactly once**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  items: { type: string }
                  description: Endpoint ids, in the desired order.
      responses:
        "200": { $ref: "#/components/responses/MockItemList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/CollectionNotFound" }

  /mocks/collections/{parentKey}/children/order:
    parameters:
      - name: parentKey
        in: path
        required: true
        description: "`root`, `unsorted`, or a collection id."
        schema: { type: string }
    patch:
      tags: [Collections]
      operationId: reorderCollectionChildren
      summary: Reorder the interleaved children of a parent
      description: |
        Sets the unified order of everything directly under one parent — endpoints **and**
        sub-collections, interleaved as the tree shows them. `childRefs` mixes endpoint ids and
        collection ids and must contain each child of that parent exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childRefs]
              properties:
                childRefs:
                  type: array
                  items: { type: string }
                  description: Endpoint ids and/or collection ids, in the desired order.
      responses:
        "200": { $ref: "#/components/responses/MockItemList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/CollectionNotFound" }

  /mocks/collections/{id}/enabled:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    patch:
      tags: [Collections]
      operationId: setCollectionEnabled
      summary: Enable or disable a whole subtree
      description: |
        Rewrites the `enabled` flag of every endpoint in the collection **and its
        descendants** — the one collection operation that changes how requests are served.
        Endpoints already in the requested state are left untouched. The whole batch shares a
        single rollback and a single runtime reload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The refreshed catalog
          content:
            application/json:
              schema:
                type: object
                required: [items, collections, childOrder]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MockSummary" }
                  collections:
                    type: array
                    items: { $ref: "#/components/schemas/CollectionSummary" }
                  childOrder: { $ref: "#/components/schemas/ChildOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/CollectionNotFound" }
        "500": { $ref: "#/components/responses/MutationFailed" }

  /mocks/collections/{id}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    delete:
      tags: [Collections]
      operationId: deleteCollection
      summary: Dissolve a collection subtree
      description: |
        Removes the collection and its descendants **without deleting endpoints**: every
        endpoint they contained moves back to the virtual `Unsorted` bucket. To delete the
        endpoints too, use `DELETE /mocks/collections/{id}/contents`.
      responses:
        "204": { description: Dissolved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/CollectionNotFound" }

  /mocks/collections/{id}/contents:
    parameters:
      - $ref: "#/components/parameters/CollectionIdWithUnsorted"
    delete:
      tags: [Collections]
      operationId: eraseCollection
      summary: Delete a subtree and every endpoint in it
      description: |
        Permanently deletes the collection subtree **and all the endpoints it contains**, files
        included. With `id=unsorted` it deletes exactly the endpoints that belong to no
        collection. One shared rollback, one runtime reload.
      responses:
        "200":
          description: How many endpoints were deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/CollectionNotFound" }
        "500": { $ref: "#/components/responses/MutationFailed" }

  # ──────────────────────────────── Endpoints ────────────────────────────────
  /mocks/enabled:
    patch:
      tags: [Mocks]
      operationId: setEndpointsEnabled
      summary: Enable or disable a list of endpoints
      description: |
        Rewrites the `enabled` flag of every endpoint named in `ids`. Same machinery as
        `PATCH /mocks/collections/{id}/enabled`, but the caller picks the endpoints instead of
        taking a whole subtree — this is what backs multi-selection in the catalog.

        All-or-nothing: the whole list shares one rollback. After the reload every listed
        endpoint is checked — enabled ones must load without errors and be served, disabled ones
        must no longer be served — and on failure every file is restored (`400
        MUTATION_REJECTED`). An unknown id fails the request before anything is written.
        Endpoints already in the requested state are not rewritten, but they are checked too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, enabled]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items: { type: string }
                  description: Endpoint ids. Duplicates are collapsed.
                enabled: { type: boolean }
            example: { ids: [YXBpL3VzZXJzL0dFVC5lbmRwb2ludC5qc29u], enabled: false }
      responses:
        "200":
          description: The refreshed catalog
          content:
            application/json:
              schema:
                type: object
                required: [items, collections, childOrder]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MockSummary" }
                  collections:
                    type: array
                    items: { $ref: "#/components/schemas/CollectionSummary" }
                  childOrder: { $ref: "#/components/schemas/ChildOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "500": { $ref: "#/components/responses/MutationFailed" }

  /mocks/{id}:
    parameters:
      - $ref: "#/components/parameters/MockId"
    get:
      tags: [Endpoints]
      operationId: getMock
      summary: Endpoint detail
      description: |
        The endpoint definition, the list of its variants, and the fully normalized **selected**
        variant — including the payload body (or file metadata), the handler source, or the
        SSE/WS script or sequence definition. When the selected variant is a sequence,
        `sequenceState` reports its live cursor.

        Reads do not wait for queued mutations and are not an atomic snapshot of several files.
        When a file is missing while the detail is built, the endpoint may have changed during
        the read: the whole detail is built once more from the definition read again,
        following its current selection. An endpoint deleted meanwhile answers `404`; a file
        still missing answers `409 READ_INCONSISTENT` with no partial detail. Other errors
        (invalid JSON, access) keep their own status and are not retried.
      responses:
        "200":
          description: Endpoint detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "409": { $ref: "#/components/responses/ReadInconsistent" }
    put:
      tags: [Endpoints]
      operationId: updateMock
      summary: Update the endpoint selection or selected ordinary variant
      description: |
        Two payload shapes are accepted:

        1. `{ selectedResponseFile }` — switches which variant answers. Selecting a `sequence`
           validates its complete graph before committing.
        2. `{ config, body }` or `{ type: handler|middleware, definition, source }` — rewrites
           the **selected** variant together with the endpoint's `enabled` flag.

        In shape 2 the route path is echoed back for validation but **cannot change**
        (`400` otherwise). A selected `sse`, `ws`, or `sequence` variant is rejected: edit it
        through `PUT /mocks/{id}/responses/{responseFileName}`. The legacy `{ sequence }`
        endpoint payload is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMockRequest" }
            examples:
              selectVariant:
                summary: Switch the answering variant
                value: { selectedResponseFile: 002.response.json }
              editMock:
                summary: Rewrite the selected mock variant
                value:
                  config:
                    method: GET
                    path: /api/users
                    status: 503
                    disabled: false
                    headers: { content-type: application/json }
                    delayMs: 1500
                  body: { error: maintenance }
      responses:
        "200":
          description: The updated endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockDetailAfterMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "500": { $ref: "#/components/responses/MutationFailed" }
    delete:
      tags: [Endpoints]
      operationId: deleteMock
      summary: Delete the endpoint
      description: Deletes the endpoint file, all its variants and their assets, and prunes the folders left empty.
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "500": { $ref: "#/components/responses/MutationFailed" }

  /mocks/{id}/endpoint:
    parameters:
      - $ref: "#/components/parameters/MockId"
    put:
      tags: [Endpoints]
      operationId: updateEndpointMetadata
      summary: Update description and enabled flag
      description: |
        Updates endpoint metadata. **Only `description` and `enabled` are accepted** — any other
        field is a `400`. Method and path are fixed at creation time; use
        `POST /mocks/{id}/copy` to produce the same endpoint on a different method or path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: [string, "null"]
                  description: "`null` clears it."
                enabled: { type: boolean }
                expectedRevision:
                  allOf: [{ $ref: "#/components/schemas/RevisionToken" }]
                  description: |
                    Optional precondition: the `descriptionRevision` read with the draft. It
                    protects `description` only, so it must come with `description` and without
                    `enabled` (`400` otherwise); a mismatch is `409 REVISION_CONFLICT`.
              additionalProperties: false
            example: { description: Returns the paginated user list, expectedRevision: "rev-v1:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08" }
      responses:
        "200":
          description: The updated endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockDetailAfterMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "500": { $ref: "#/components/responses/MutationFailed" }

  /mocks/{id}/copy:
    parameters:
      - $ref: "#/components/parameters/MockId"
    post:
      tags: [Endpoints]
      operationId: copyEndpoint
      summary: Duplicate the endpoint onto another method and path
      description: |
        Copies the endpoint to a new method + path, inheriting description and enabled flag.
        By default only the **selected** variant is copied. If it is a `sequence`, its referenced
        step variants and their assets are copied too, forming the minimum executable closure.
        `copyResponses: true` copies every variant with its assets and preserves the selection.
        Since the path defines the folder, this is also how you "move" an
        endpoint: copy, then delete the original.
        With `dryRun=true` the same planner validates the destination and returns files, assets
        and best-effort literal shared-state references without writing or reloading anything.
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Must occur at most once and be exactly `true` or `false` on the wire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, path]
              properties:
                method: { $ref: "#/components/schemas/HttpMethod" }
                path: { $ref: "#/components/schemas/RoutePath" }
                copyResponses:
                  type: boolean
                  default: false
            example: { method: GET, path: /api/v2/users, copyResponses: true }
      responses:
        "200":
          description: Read-only copy plan (`dryRun=true`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointCopyPreview" }
        "201":
          description: The new endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockDetailAfterMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "409":
          description: An endpoint already exists at the destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/MutationFailed" }

  /mocks/{id}/collection:
    parameters:
      - $ref: "#/components/parameters/MockId"
    put:
      tags: [Endpoints]
      operationId: assignCollection
      summary: Assign the endpoint to a collection
      description: Moves the endpoint into a collection, optionally at a given position. A `null` `collectionId` moves it back to the virtual `Unsorted` bucket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionId:
                  type: [string, "null"]
                  description: "`null`/absent → Unsorted."
                targetIndex:
                  type: integer
                  minimum: 0
                  description: Position inside the target collection; appended when absent.
            example: { collectionId: authentication, targetIndex: 0 }
      responses:
        "200":
          description: The updated endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockDetailAfterMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Endpoint or collection not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mocks/{id}/sequence/state:
    parameters:
      - $ref: "#/components/parameters/MockId"
    get:
      tags: [Endpoints]
      operationId: getSequenceState
      summary: Read the live cursor of the selected sequence
      responses:
        "200":
          description: Selected sequence file and live cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SequenceStateResponse" }
        "400":
          description: The selected response is not a sequence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/MockNotFound" }

  /mocks/{id}/sequence/reset:
    parameters:
      - $ref: "#/components/parameters/MockId"
    post:
      tags: [Endpoints]
      operationId: resetSequence
      summary: Restart the sequence from its first step
      description: |
        Runtime action, no file touched: the next request starts over from the first step.
        It also clears the endpoint's **handler memory** (`state`, `callCount`,
        `firstRequestAt`), otherwise a handler step would resume mid-story.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          description: The reset cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SequenceStateResponse" }
        "400":
          description: The selected response is not a sequence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/MockNotFound" }

  /mocks/{id}/sse/push:
    parameters:
      - $ref: "#/components/parameters/MockId"
    post:
      tags: [Endpoints]
      operationId: pushSseMessage
      summary: Broadcast an SSE message to the open connections
      description: |
        Sends one message to **every** connection currently open on this endpoint, on top of
        whatever its script is doing. The target is the definition the installed runtime
        serves — including a previous route kept because a newer selection failed to load —
        not the selection on disk: it must be of type `sse`. It does not wait for queued
        mutations. The message is recorded in the console history even when nobody is
        listening.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SseMessage" }
            example: { event: order-updated, data: { id: 42, status: shipped } }
      responses:
        "200": { $ref: "#/components/responses/PushResult" }
        "400":
          description: Invalid message, or the served variant is not an `sse` one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/StreamEndpointNotServed" }

  /mocks/{id}/sse/connections:
    parameters:
      - $ref: "#/components/parameters/MockId"
    get:
      tags: [Endpoints]
      operationId: listSseState
      summary: SSE console state
      description: Open connections (with their position in the script) and the history of messages sent out, scripted and manual alike. Resolved like `POST /mocks/{id}/sse/push`, from the definition the installed runtime serves, which must be of type `sse`.
      responses:
        "200":
          description: Console state
          content:
            application/json:
              schema:
                type: object
                required: [connections, history]
                properties:
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/SseConnection" }
                  history:
                    type: array
                    description: Oldest first, capped to the most recent messages.
                    items: { $ref: "#/components/schemas/SseHistoryEntry" }
        "400":
          description: The served variant is not an `sse` one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/StreamEndpointNotServed" }

  /mocks/{id}/ws/push:
    parameters:
      - $ref: "#/components/parameters/MockId"
    post:
      tags: [Endpoints]
      operationId: pushWsMessage
      summary: Broadcast a WebSocket message to the open connections
      description: Sends `data` to every open connection of this endpoint. Resolved like `POST /mocks/{id}/sse/push`, from the definition the installed runtime serves, which must be of type `ws`. Non-string `data` travels as JSON on the wire.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WsMessage" }
            example: { data: { type: tick, value: 12 } }
      responses:
        "200": { $ref: "#/components/responses/PushResult" }
        "400":
          description: Invalid message, or the served variant is not a `ws` one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/StreamEndpointNotServed" }

  /mocks/{id}/ws/connections:
    parameters:
      - $ref: "#/components/parameters/MockId"
    get:
      tags: [Endpoints]
      operationId: listWsState
      summary: WebSocket console state
      description: Open connections and the **bidirectional** transcript (messages sent and received). Resolved like `POST /mocks/{id}/sse/push`, from the definition the installed runtime serves, which must be of type `ws`.
      responses:
        "200":
          description: Console state
          content:
            application/json:
              schema:
                type: object
                required: [connections, transcript]
                properties:
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/WsConnection" }
                  transcript:
                    type: array
                    description: Oldest first, capped to the most recent messages.
                    items: { $ref: "#/components/schemas/WsTranscriptEntry" }
        "400":
          description: The served variant is not a `ws` one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/StreamEndpointNotServed" }

  # ───────────────────────────── Response variants ────────────────────────────
  /mocks/{id}/responses:
    parameters:
      - $ref: "#/components/parameters/MockId"
    post:
      tags: [Response variants]
      operationId: createResponse
      summary: Add a response variant
      description: |
        Adds a variant and **selects it**, unless `select: false`. The new file name is the next
        free `NNN.response.json` and comes back as `createdResponseFile`.

        With `select: false` the variant is **prepared without being activated**: the selection,
        the sequence cursor and the handler memory stay as they were, so the current response and
        scenario do not change. It goes through the same validation as any write: schema, direct
        source or asset (a file-backed mock's asset must exist), compilation, and step references
        and compatibility for a sequence (the handler is not executed). A variant prepared this way is never part of the active
        scenario; to change a step of the sequence in use without touching it, prepare a separate
        variant, and a separate sequence if needed.

        - With no body (or only `title`), the currently selected variant is **cloned**, assets
          included (the copy gets its own asset files).
        - With a `type` different from the selected one, a fresh variant of that type is built
          from its defaults — this is how an endpoint ends up with mixed variant types.
        - With other fields and the same type, the payload is merged onto the clone.

        A new `sequence` requires at least two steps. Every referenced variant is resolved with
        the runtime loader before success; only `mock` and `handler` variants are allowed.

        For `handler`/`middleware`, omitting `source` writes a working scaffold; the source is
        compiled before the change is committed, and a source that fails to load rolls the whole
        operation back.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateResponseRequest" }
            examples:
              clone:
                summary: Clone the selected variant
                value: { title: Error case }
              newMock:
                summary: New mock variant
                value: { type: mock, title: Not found, status: 404, body: { error: not found } }
              newSse:
                summary: New SSE variant with a script
                value:
                  type: sse
                  title: Order stream
                  onEnd: keep-open
                  script:
                    - { afterMs: 0, event: hello, data: { ok: true } }
                    - { afterMs: 1000, data: { tick: 1 } }
              newSequence:
                summary: Serve processing twice, then completed forever
                value:
                  type: sequence
                  title: Polling operation
                  onEnd: stay
                  steps:
                    - { response: 001.response.json, times: 2 }
                    - { response: 002.response.json }
              prepare:
                summary: Prepare an error variant without activating it
                value: { type: mock, title: Server error, status: 500, body: { error: boom }, select: false }
      responses:
        "201":
          description: The endpoint, with the new variant selected unless `select` was `false`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseVariantCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "409":
          description: The generated file or asset name is already taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/MutationFailed" }

  /mocks/{id}/responses/{responseFileName}:
    parameters:
      - $ref: "#/components/parameters/MockId"
      - $ref: "#/components/parameters/ResponseFileName"
    get:
      tags: [Response variants]
      operationId: getResponse
      summary: One response variant, active or not
      description: |
        The normalized definition of the variant named in the path, selected or not, with the
        text of its direct source (`handler`, `middleware`) or the metadata of its asset (a
        file-backed `mock`; binary content is never returned). Reading it changes neither the
        selection nor the scenario.

        `active` tells whether the variant is the selected one or a step of the selected
        sequence, whatever the `/server` switches: it does not mean currently reachable. Check it
        before calling an update by filename non-invasive: changing an active step changes the
        running scenario.

        A variant no longer listed by the endpoint answers `404`, even if its file is still on
        disk. A file missing during the read follows the same bounded procedure as the endpoint
        detail (`409 READ_INCONSISTENT`); other definition errors keep their explicit `400` —
        including those of the selected variant, which `active` depends on: the route never
        guesses `active` when the selection cannot be read.
      responses:
        "200":
          description: The variant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseVariant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "409": { $ref: "#/components/responses/ReadInconsistent" }
    put:
      tags: [Response variants]
      operationId: updateResponse
      summary: Update a response variant
      description: |
        Partial update of one variant: absent fields keep their current value. The variant
        **type cannot change** (`400`).

        - `mock`: `status`, `headers`, `delayMs`, `title`, `templated`, and `body`. Sending an
          explicit `body` on a file-backed variant switches it back to an inline payload and
          drops the orphaned asset; `templated` is not supported on file payloads.
        - `sse` / `ws`: the payload is merged onto the current script/rules/presets and then
          validated exactly as the runtime loader would.
        - `handler` / `middleware`: `title`, and `source` to rewrite the module (validated by
          compiling it; a failure rolls back).
        - `sequence`: `title`, `steps`, `onEnd`, and `resetAfterMs`; the complete result graph is
          validated before committing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateResponseRequest" }
            examples:
              mock:
                summary: Slow down one variant
                value: { delayMs: 2000, status: 200 }
              templated:
                summary: Enable placeholder rendering
                value: { templated: true, body: { id: "{{params.id}}", q: "{{query.q}}" } }
              handler:
                summary: Rewrite a handler source
                value:
                  source: |
                    module.exports = {
                      async resolveResponse({ params }) {
                        return { status: 200, jsonBody: { id: params.id } };
                      }
                    };
      responses:
        "200":
          description: The updated endpoint, with the variant that was updated in `updatedResponseFile`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseVariantUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "500": { $ref: "#/components/responses/MutationFailed" }
    delete:
      tags: [Response variants]
      operationId: deleteResponse
      summary: Delete a response variant
      description: |
        Deletes the variant and its asset, unless another variant still references that asset.
        The **last** variant of an endpoint cannot be deleted (`400`) — delete the endpoint
        instead. A variant referenced by any sequence cannot be deleted (`409`, with
        `details.referencedBy`). If the deleted variant was selected, the one immediately before
        it takes over.
      responses:
        "200":
          description: The updated endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockDetailAfterMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "409":
          description: The response is referenced by one or more sequence variants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/MutationFailed" }

  /mocks/{id}/responses/{responseFileName}/file:
    parameters:
      - $ref: "#/components/parameters/MockId"
      - $ref: "#/components/parameters/ResponseFileName"
    put:
      tags: [Response variants]
      operationId: setResponseFile
      summary: Make a variant file-backed by uploading its bytes
      description: |
        Uploads the raw payload of a `mock` variant. The bytes are stored next to the variant and
        served **streamed from disk**, so a large payload never sits in memory. The variant
        switches from `body` to `file`, and the uploaded MIME becomes its `content-type` header
        (you can override it later with an explicit header).

        The bytes travel as the raw request body — MIME type and file name go in the query
        string, so that the router's JSON parser does not intercept them. Max 12 MB. To go back
        to an inline payload, send an explicit `body` to
        `PUT /mocks/{id}/responses/{responseFileName}`.
      parameters:
        - name: filename
          in: query
          description: Original file name; only its extension is kept, to name the stored asset.
          schema: { type: string }
          example: report.pdf
        - name: contentType
          in: query
          description: MIME type to store as the variant's `content-type` header.
          schema: { type: string }
          example: application/pdf
        - name: X-Mockxy-Expected-Revision
          in: header
          description: |
            Optional precondition, as `expectedRevision` of the JSON updates: the revision of this
            variant read with the draft. A mismatch is `409 REVISION_CONFLICT`. Control data never
            travels inside the uploaded file.
          schema: { $ref: "#/components/schemas/RevisionToken" }
      requestBody:
        required: true
        description: The raw bytes. Any content type is accepted; `application/octet-stream` is the intended one.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The updated endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseVariantUpdated" }
        "400":
          description: Empty upload, the variant is not a `mock` one, or a malformed precondition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/MockNotFound" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "500": { $ref: "#/components/responses/MutationFailed" }

  # ─────────────────────────────── OpenAPI import ─────────────────────────────
  /mocks/import/openapi:
    post:
      tags: [OpenAPI import]
      operationId: importOpenapi
      summary: Create mock endpoints from an OpenAPI document
      description: |
        Takes an OpenAPI document as the **raw request body** (JSON or YAML, up to 12 MB) and
        creates one mock endpoint per operation, with a body sampled from the first successful
        response schema. Operation tags become collections, reusing existing ones by label;
        endpoints that already exist are skipped rather than overwritten. The import degrades per
        operation, with one runtime reload at the end: `items` and `runtime` tell which created
        endpoints are actually served.

        With `dryRun=true` nothing is written and the response is the **plan** — every operation
        with the action that would be taken — so a wizard can show it before committing. The
        plan omits the sampled bodies, which can be large.

        `text/plain` is rejected with `415` on purpose: it is the one content type a browser can
        post cross-origin without a preflight, and this is the only mutating route that does not
        require JSON.
      parameters:
        - name: dryRun
          in: query
          description: Plan only, write nothing.
          schema: { type: boolean, default: false }
        - name: prefix
          in: query
          description: Prefix prepended to every imported path (e.g. `/be`). Applies to dry runs too.
          schema: { type: string }
          example: /be
      requestBody:
        required: true
        description: The OpenAPI document, verbatim.
        content:
          application/json:
            schema: { type: string }
          application/yaml:
            schema: { type: string }
          application/x-yaml:
            schema: { type: string }
          text/yaml:
            schema: { type: string }
      responses:
        "200":
          description: The plan (`dryRun=true` only — nothing was written).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenapiImportPlan" }
        "201":
          description: Import summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenapiImportResult" }
        "400":
          description: The document could not be parsed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Unsupported content type (notably `text/plain`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/BatchFailed" }

  # ───────────────────────────────── Data files ───────────────────────────────
  /files:
    get:
      tags: [Data files]
      operationId: listDataFiles
      summary: List the data files
      description: |
        Every data file with its metadata and `usedBy`, the endpoints whose handler or middleware
        source references it through `data("name")`. The reverse index is built by scanning
        sources for **literal** references: an empty `usedBy` means "no direct reference found",
        not "certainly unused".
      responses:
        "200":
          description: The data files
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DataFileSummary" }
        "500":
          description: The data files folder is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /files/{name}:
    parameters:
      - $ref: "#/components/parameters/DataFileName"
    get:
      tags: [Data files]
      operationId: readDataFile
      summary: Read a data file
      description: Metadata plus the file content, as raw text (so the caller sees the exact formatting on disk).
      responses:
        "200":
          description: The data file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataFileDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/DataFileNotFound" }
    put:
      tags: [Data files]
      operationId: putDataFile
      summary: Create or replace a data file
      description: |
        Uploads the raw bytes of a JSON file (up to 25 MB). The content is **parsed before
        anything is written**: invalid JSON is a `400` and the file on disk is untouched. The
        write itself is atomic (temp file + rename), and the folder is created on first upload.

        Answers `201` when the file did not exist, `200` when it was replaced. No runtime reload
        is needed: `data()` re-reads on every call.
      requestBody:
        required: true
        description: The JSON file bytes.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/json:
            schema: {}
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataFileSummary" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataFileSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
    patch:
      tags: [Data files]
      operationId: renameDataFile
      summary: Rename a data file
      description: |
        Renames to the canonical (lowercase) form of `name`; an existing target is a `409`.
        With `rewriteReferences: true` the literal `data("old")` occurrences in handler and
        middleware sources are rewritten too — atomically, with rollback — and the runtime is
        reloaded so the already-compiled modules point at the new name. Dynamic references
        cannot be found and are left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: New name (normalized to lowercase, extension optional).
                rewriteReferences:
                  type: boolean
                  default: false
            example: { name: users-v2, rewriteReferences: true }
      responses:
        "200":
          description: The renamed file, plus what the rewrite touched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataFileRenameResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/DataFileNotFound" }
        "409":
          description: A data file with the target name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/MutationFailed" }
    delete:
      tags: [Data files]
      operationId: deleteDataFile
      summary: Delete a data file
      description: Deletes the file. Handlers still calling `data("name")` will fail at request time — check `usedBy` first.
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/DataFileNotFound" }

  # ──────────────────────────────── Monitoring ────────────────────────────────
  /monitoring/requests:
    get:
      tags: [Monitoring]
      operationId: listMonitorEntries
      summary: The live request feed, whole or page by page
      description: |
        The in-memory history of served requests, capped to the last few hundred entries.
        Requests to `/_admin/api` are never recorded, and automatic CORS preflights are filtered
        out as browser plumbing. Sensitive headers (`authorization`, `cookie`, `set-cookie`, …)
        are masked as `***`; bodies are captured up to ~156 KB and flagged as truncated beyond
        that. The monitor is not an archive: for durable capture use the dump.

        **Without a query string** the answer is `{ items }`: every entry, full, **most recent
        first** — unchanged from earlier versions.

        **With `view=page`** the answer is a page in **ascending** id order, with filters and a
        cursor. Ids are decimal strings, increasing within a runtime; `generation` starts at 1 and
        grows at every clear, even of an empty feed, and a clear never reuses ids. Each page reads
        one snapshot with `highWatermark` H (the last id assigned, `"0"` before the first request).
        It returns up to `limit` matches after the cursor; if more matches remain in the snapshot,
        `hasMore` is `true` and `cursor.since` is the last id returned, otherwise `hasMore` is
        `false` and `cursor.since` is H, also with no match. Traffic after H belongs to the next
        page, it is not lost. Keep the same filters while reading incrementally; changing them
        needs a fresh read (no `since`, or `since=latest`), because the cursor may already be past
        entries the old filter excluded. `limit` and `fields` may change between pages.

        Without `since` the page starts at the oldest entry still available, with `gap: false`:
        the past already evicted is not claimed as covered. `since=latest` returns no items and a
        cursor at H: read what happens from now on. With a numeric `since`, a cursor of another
        runtime (`runtime_changed`), of another generation (`cleared`) or already evicted
        (`evicted`: `since` below `oldestId - 1`) answers `200` with `gap: true`, the reason, and
        the page from the oldest entry still available — also when the feed is empty. **Never
        conclude "no requests" from empty `items` when `gap` is `true`**: the lost range may have
        held matches. In the same runtime and generation a `since` above H is
        `400 CURSOR_AHEAD`.

        Any query parameter requires `view=page`, and an unknown parameter is a `400` with
        `details.code: INVALID_QUERY` and the offending `details.parameter`: earlier versions
        ignored them silently.
      parameters:
        - name: view
          in: query
          description: "`page` selects the paged mode; required by every other parameter."
          schema: { type: string, enum: [page] }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 250, default: 50 }
        - name: fields
          in: query
          description: "`summary` (no bodies, no headers) or `full` (the complete entry, truncation flags included)."
          schema: { type: string, enum: [summary, full], default: summary }
        - name: method
          in: query
          description: Exact method, case-insensitive (normalized to uppercase).
          schema: { type: string }
        - name: path
          in: query
          description: Exact request path, without query string; must start with `/`.
          schema: { type: string, pattern: "^/[^?]*$" }
        - name: status
          in: query
          description: Exact response status.
          schema: { type: integer, minimum: 100, maximum: 599 }
        - name: source
          in: query
          description: Exact `source` of the entry (e.g. `mock`, `handler`, `proxy`).
          schema: { type: string, minLength: 1 }
        - name: since
          in: query
          description: Exclusive decimal id from the previous `cursor.since`, or `latest` to start from now. Absent to read the available feed.
          schema: { type: string, pattern: "^(0|[1-9][0-9]*|latest)$" }
        - name: runtimeId
          in: query
          description: "`cursor.runtimeId`: required with a numeric `since`, forbidden otherwise."
          schema: { type: string }
        - name: generation
          in: query
          description: "`cursor.generation`: required with a numeric `since`, forbidden otherwise."
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: "`{ items }` without a query; a `MonitorPage` with `view=page`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorRequestsResponse" }
              examples:
                page:
                  summary: Filter matching ids 12, 14 and 15 of a feed holding 11–15, since 10, limit 2
                  value:
                    items:
                      - { id: "12", timestamp: "2026-09-29T10:00:01.000Z", method: GET, path: /match, originalUrl: /match, status: 200, latencyMs: 3, source: mock, matchedRoutePath: /match, sequenceStep: null, sharedStateError: null }
                      - { id: "14", timestamp: "2026-09-29T10:00:03.000Z", method: GET, path: /match, originalUrl: /match, status: 200, latencyMs: 2, source: mock, matchedRoutePath: /match, sequenceStep: null, sharedStateError: null }
                    cursor: { runtimeId: 7d9f1c4e-2b0a-4c7e-9f3a-5e8d2c1b4a60, generation: 1, since: "14" }
                    hasMore: true
                    gap: false
                    gapReason: null
                    available: { oldestId: "11", newestId: "15", highWatermark: "15" }
        "400":
          description: "`INVALID_QUERY` (with `details.parameter`) or `CURSOR_AHEAD` (with `details.since` and `details.highWatermark`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Monitoring]
      operationId: clearMonitorEntries
      summary: Clear the live feed
      description: Empties the in-memory view and notifies live subscribers with a `clear` event. **Durable dumps on disk are not touched.**
      responses:
        "204": { description: Cleared. }

  /monitoring/requests/stream:
    get:
      tags: [Monitoring]
      operationId: streamMonitorEntries
      summary: Live event stream (SSE)
      description: |
        A Server-Sent Events stream of monitoring events. The first event is always a `snapshot`
        with the current entries, then one `request` event per served request, and a `clear`
        event when the feed is emptied. A `: keep-alive` comment every 15 s keeps proxies from
        closing the connection.

        Each event is a single `data:` line containing JSON.
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/MonitorStreamEvent" }
              examples:
                snapshot:
                  summary: First event
                  value: { type: snapshot, items: [] }
                request:
                  summary: A request was served
                  value: { type: request, item: { id: "12", method: GET, path: /api/users, status: 200, source: mock } }
                clear:
                  summary: The feed was emptied
                  value: { type: clear }

  /monitoring/requests/create-mocks:
    post:
      tags: [Monitoring]
      operationId: createMocksFromMonitor
      summary: Turn monitor captures into mocks
      description: |
        Creates mocks from entries of the live monitor, **in the order given**. `runtimeId` must be
        the current runtime (ids restart at every start): otherwise `409 RUNTIME_CHANGED` before
        writing anything. The entries are copied at the start of the batch's turn in the mutation
        queue, so an eviction afterwards does not invalidate a capture already taken; an id that is
        no longer available is a `skipped` item with `captureOutcome: unavailable`, and the others go
        on. `onConflict` and `newEndpointEnabled` are required: capturing traffic never activates
        anything implicitly. To prepare without affecting what is served, send
        `newEndpointEnabled: false` and `selectAddedVariants: false`, and check the incomplete items
        before activating them.

        The transformation (shared by the monitor and the history):

        - **Route and method:** the captured `matchedRoutePath` when present and not `n/d`, otherwise
          the request path; the method in uppercase. No parametric route is inferred.
        - **Status and delay:** the captured status; `delayMs` 0.
        - **Body:** empty → `{}`; valid JSON → the parsed value; other text → the string. A truncated
          body or a `[binary payload: …]`/`[compressed payload: …]` placeholder → `{}`, and the draft
          is **incomplete**: a new endpoint gets the description `[da completare] …`, an added variant
          the title prefix `[da completare]`, and the item the warning `INCOMPLETE_CAPTURE` with
          `reason` `truncated` or `binary`. Enabling and selection follow the flags anyway.
        - **Headers:** the captured response headers, without `content-length`, `content-encoding`,
          `transfer-encoding`, `connection`, `keep-alive`, `date`, Mockxy's own `x-mock-source`
          (serving sets it), empty values and masked `***` values (a masked value is never
          restored); array values are joined with `, `.
        - **Conflict:** on the destination's identity, exact method and route path, against the
          catalog and the items already processed in the same batch. `skip` leaves it; `add-variant`
          adds a variant (titled with the source and the UTC capture time, e.g. `monitor · 10:11:12`)
          and keeps the endpoint's enabled state, selecting it only with `selectAddedVariants`.
          Several equivalent destinations are a per-item `failed` with `candidates`, never a guess;
          an endpoint file in the derived folder that does not declare that identity is a `failed`
          item too. A new endpoint gets the variant selected and is enabled only with
          `newEndpointEnabled`.

        One runtime reload at the end. A batch is **not idempotent**: after a lost response, read
        the catalog and stop unless you can tell with certainty which items were created — do not
        retry blindly. Captures and dump files are never deleted by the conversion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runtimeId, ids, onConflict, newEndpointEnabled]
              properties:
                runtimeId: { type: string, description: "`cursor.runtimeId` of the page the ids come from." }
                ids:
                  type: array
                  minItems: 1
                  maxItems: 250
                  uniqueItems: true
                  items: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
                onConflict: { type: string, enum: [skip, add-variant] }
                selectAddedVariants: { type: boolean, default: false }
                newEndpointEnabled: { type: boolean }
            example: { runtimeId: 7d9f1c4e-2b0a-4c7e-9f3a-5e8d2c1b4a60, ids: ["41", "42"], onConflict: add-variant, selectAddedVariants: false, newEndpointEnabled: false }
      responses:
        "201":
          description: One outcome per requested id, in order.
          content:
            application/json:
              schema:
                type: object
                required: [runtimeId, counts, items, runtime]
                properties:
                  runtimeId: { type: string }
                  counts:
                    type: object
                    required: [created, addedVariants, skipped, unavailable, failed, incomplete]
                    properties:
                      created: { type: integer, description: New endpoints. }
                      addedVariants: { type: integer }
                      skipped: { type: integer, description: "Conflicts left untouched with `onConflict: skip`." }
                      unavailable: { type: integer, description: Captures no longer in the monitor. }
                      failed: { type: integer }
                      incomplete: { type: integer, description: Created endpoints and added variants built from an incomplete capture. }
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CaptureItemOutcome"
                        - type: object
                          required: [requestId]
                          properties:
                            requestId: { type: string, description: The monitor entry id. }
                  runtime: { $ref: "#/components/schemas/BatchRuntime" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: "`RUNTIME_CHANGED`: the ids belong to another runtime; `details.runtimeId` is the current one. Nothing written."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/BatchFailed" }

  /monitoring/requests/{id}:
    get:
      tags: [Monitoring]
      operationId: getMonitorEntry
      summary: One entry by id, complete
      description: |
        The full entry, bodies and truncation flags included, for an id read from a page. Ids
        restart at every start of the engine, so the call names the runtime the id belongs to.
      parameters:
        - name: id
          in: path
          required: true
          description: Decimal entry id.
          schema: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        - name: runtimeId
          in: query
          required: true
          description: The `cursor.runtimeId` the id came with.
          schema: { type: string }
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorEntryRead" }
        "400":
          description: "`INVALID_QUERY`: missing `runtimeId`, malformed id or unknown parameter."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`REQUEST_NOT_AVAILABLE`: evicted, cleared or never recorded."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`RUNTIME_CHANGED`: the engine restarted; `details.runtimeId` is the current one."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /monitoring/dump:
    get:
      tags: [Monitoring]
      operationId: getDumpStatus
      summary: Durable capture status
      description: Whether traffic is being written to disk, with the current cadence, thresholds and active file. Answers with `enabled` false and nothing else when the runtime has no dump writer.
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DumpStatus" }
    patch:
      tags: [Monitoring]
      operationId: setDumpConfig
      summary: Start, stop or tune the durable capture
      description: |
        Turns the NDJSON capture on or off and adjusts its cadence at runtime. Unlike the live
        feed, the dump buffers **every** request — its retention is the disk, not the 250-entry
        window. Files rotate per session and by size; old files are pruned when the folder
        exceeds its total cap.

        Changing `intervalMs`/`threshold` while running re-arms the timer without rotating the
        current file. Stopping performs a final flush. The size limits apply from the next
        write, rotation or pruning: no file is deleted by the call itself, and a single entry
        larger than `maxFileBytes` can still exceed it. The whole body is validated before any
        field applies. Every change lasts until the engine restarts, which brings back the
        startup values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                intervalMs:
                  type: number
                  exclusiveMinimum: 0
                  description: Flush cadence.
                threshold:
                  type: integer
                  exclusiveMinimum: 0
                  description: Buffered entries that trigger an early flush.
                maxFileBytes:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                  description: Size at which the current file rotates.
                maxTotalBytes:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                  description: Size cap of the dump folder; older files are pruned above it. `0` disables pruning.
            example: { enabled: true, intervalMs: 5000, threshold: 50, maxFileBytes: 10485760 }
      responses:
        "200":
          description: The resulting status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DumpStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /monitoring/dump/flush:
    post:
      tags: [Monitoring]
      operationId: flushDump
      summary: Flush the buffered entries now
      description: Writes whatever is buffered and waits for the write queue to drain — the way to make captured traffic readable immediately (e.g. in a test).
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          description: How many entries were taken in, plus the current status.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [flushed]
                    properties:
                      flushed: { type: integer }
                  - { $ref: "#/components/schemas/DumpStatus" }

  # ─────────────────────────── Shared runtime state ─────────────────────────
  /runtime/shared-state:
    get:
      tags: [Shared runtime state]
      operationId: listSharedRuntimeState
      summary: List shared-state metadata and limits
      description: Returns lifecycle metadata and resource identities, never stored JSON values.
      responses:
        "200":
          description: Current resources, aggregate bytes and defensive limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedStateList" }

  /runtime/shared-state/{name}/reset:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: Canonical shared-state resource name (case and surrounding whitespace are normalized).
    post:
      tags: [Shared runtime state]
      operationId: resetSharedRuntimeState
      summary: Reset one resource generation
      description: Idempotent and immediate. It does not reload files or reset sequence/handler-local state.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          description: Whether a current generation existed.
          content:
            application/json:
              schema:
                type: object
                required: [name, reset]
                properties:
                  name: { type: string }
                  reset: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }

  /runtime/shared-state/reset:
    post:
      tags: [Shared runtime state]
      operationId: resetAllSharedRuntimeState
      summary: Reset every resource generation
      description: Counts ready and initializing entries removed at the linearization point.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          description: Number of removed entries.
          content:
            application/json:
              schema:
                type: object
                required: [resetCount]
                properties:
                  resetCount: { type: integer, minimum: 0 }

  /monitoring/dumps:
    get:
      tags: [Monitoring]
      operationId: listDumpFiles
      summary: List the dump files
      description: The NDJSON files in the dump folder, in chronological order (their names carry the session timestamp).
      responses:
        "200":
          description: The files
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/DumpFile" }

  /monitoring/dumps/read:
    get:
      tags: [Monitoring]
      operationId: readDumpPage
      summary: Read the archive, page by page
      description: |
        Forward cursor pagination across **all** dump files in chronological order, built for
        virtual scrolling. Reading is streamed, so a file is never loaded whole into memory, and
        no total is computed: keep requesting until `done` is `true`, passing back `nextCursor`.

        Each item is a monitor entry plus a `dumpKey` (`<file>#<lineIndex>`), stable because the
        files are append-only — that key is what `create-mocks` selects on.
      parameters:
        - name: fileIndex
          in: query
          description: Cursor — index of the file to resume from.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: lineIndex
          in: query
          description: Cursor — line to resume from inside that file.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, default: 300 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, done]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DumpEntry" }
                  nextCursor:
                    oneOf:
                      - type: object
                        required: [fileIndex, lineIndex]
                        properties:
                          fileIndex: { type: integer }
                          lineIndex: { type: integer }
                      - { type: "null" }
                  done:
                    type: boolean
                    description: True when the archive has been fully read.

  /monitoring/dumps/create-mocks:
    post:
      tags: [Monitoring]
      operationId: createMocksFromDump
      summary: Turn captured traffic into mock endpoints
      description: |
        Bulk-creates mocks from archived entries, either a whole file (in file order) or a selected
        set of `dumpKey`s (in the order given; a repeated key counts once, and a key that cannot be
        read is a `skipped` item with `captureOutcome: unavailable`). It accepts the same options as
        `POST /monitoring/requests/create-mocks`, optional here with the historical defaults
        `onConflict: skip`, `selectAddedVariants: false` and `newEndpointEnabled: true`; a
        preparation flow sends them explicitly. The counts keep their meaning and add
        `addedVariants`.

        The transformation (shared by the monitor and the history):

        - **Route and method:** the captured `matchedRoutePath` when present and not `n/d`, otherwise
          the request path; the method in uppercase. No parametric route is inferred.
        - **Status and delay:** the captured status; `delayMs` 0.
        - **Body:** empty → `{}`; valid JSON → the parsed value; other text → the string. A truncated
          body or a `[binary payload: …]`/`[compressed payload: …]` placeholder → `{}`, and the draft
          is **incomplete**: a new endpoint gets the description `[da completare] …`, an added variant
          the title prefix `[da completare]`, and the item the warning `INCOMPLETE_CAPTURE` with
          `reason` `truncated` or `binary`. Enabling and selection follow the flags anyway.
        - **Headers:** the captured response headers, without `content-length`, `content-encoding`,
          `transfer-encoding`, `connection`, `keep-alive`, `date`, Mockxy's own `x-mock-source`
          (serving sets it), empty values and masked `***` values (a masked value is never
          restored); array values are joined with `, `.
        - **Conflict:** on the destination's identity, exact method and route path, against the
          catalog and the items already processed in the same batch. `skip` leaves it; `add-variant`
          adds a variant (titled with the source and the UTC capture time, e.g. `monitor · 10:11:12`)
          and keeps the endpoint's enabled state, selecting it only with `selectAddedVariants`.
          Several equivalent destinations are a per-item `failed` with `candidates`, never a guess;
          an endpoint file in the derived folder that does not declare that identity is a `failed`
          item too. A new endpoint gets the variant selected and is enabled only with
          `newEndpointEnabled`.

        One runtime reload at the end. A batch is **not idempotent**: after a lost response, read
        the catalog and stop unless you can tell with certainty which items were created — do not
        retry blindly. Captures and dump files are never deleted by the conversion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - oneOf:
                    - type: object
                      title: Whole file
                      required: [file]
                      properties:
                        file:
                          type: string
                          pattern: '^dump-[A-Za-z0-9._-]+\.ndjson$'
                    - type: object
                      title: Selected entries
                      required: [keys]
                      properties:
                        keys:
                          type: array
                          items: { type: string }
                          description: "`dumpKey` values (`<file>#<lineIndex>`)."
                - type: object
                  properties:
                    onConflict: { type: string, enum: [skip, add-variant], default: skip }
                    selectAddedVariants: { type: boolean, default: false }
                    newEndpointEnabled: { type: boolean, default: true }
            examples:
              wholeFile:
                value: { file: dump-2026-08-03T09-12-44-321Z.ndjson }
              selection:
                value: { keys: ["dump-2026-08-03T09-12-44-321Z.ndjson#0", "dump-2026-08-03T09-12-44-321Z.ndjson#7"] }
      responses:
        "201":
          description: Counts of what happened.
          content:
            application/json:
              schema:
                type: object
                required: [created, createdEmpty, skippedExisting, failed, addedVariants, items, runtime]
                properties:
                  created:
                    type: integer
                    description: Endpoints created with a usable captured body.
                  createdEmpty:
                    type: integer
                    description: Endpoints created from an incomplete capture (body binary or truncated).
                  skippedExisting:
                    type: integer
                    description: "Conflicts left untouched with `onConflict: skip`."
                  failed:
                    type: integer
                  addedVariants:
                    type: integer
                    description: "Variants added to existing endpoints with `onConflict: add-variant`."
                  items:
                    type: array
                    description: One outcome per entry, in the order processed.
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CaptureItemOutcome"
                        - type: object
                          required: [key]
                          properties:
                            key: { type: [string, "null"], description: The entry's `dumpKey`. }
                  runtime: { $ref: "#/components/schemas/BatchRuntime" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/BatchFailed" }

  /monitoring/dumps/{file}:
    parameters:
      - name: file
        in: path
        required: true
        description: Dump file name; must match the dump naming pattern (path traversal guard).
        schema: { type: string, pattern: '^dump-[A-Za-z0-9._-]+\.ndjson$' }
    delete:
      tags: [Monitoring]
      operationId: deleteDumpFile
      summary: Delete a dump file
      responses:
        "204": { description: Deleted (also when the file was already gone). }
        "400":
          description: Invalid dump file name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ─────────────────────────────── Server state ───────────────────────────────
  /server:
    get:
      tags: [Server state]
      operationId: getServerState
      summary: Runtime switches
      description: |
        Two booleans that combine into three modes:

        | `serverEnabled` | `proxyAll` | Behaviour |
        |---|---|---|
        | `true` | `false` | **Active** — mocks, handlers and middleware serve; traffic is monitored. |
        | `true` | `true` | **Proxy all** — everything goes straight to the backend, but traffic is still monitored. |
        | `false` | any | **Off** — everything goes straight to the backend and nothing is monitored. |

        Deliberately **not persisted**: a restart returns to `active`. It is an operational
        switch, not catalog data.
      responses:
        "200": { $ref: "#/components/responses/ServerState" }
    patch:
      tags: [Server state]
      operationId: setServerState
      summary: Update the runtime switches
      description: Partial update; absent fields keep their value. Non-boolean values are rejected with `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serverEnabled: { type: boolean }
                proxyAll: { type: boolean }
            example: { proxyAll: true }
      responses:
        "200": { $ref: "#/components/responses/ServerState" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ────────────────────────────────── Runtime ─────────────────────────────────
  /info:
    get:
      tags: [Runtime]
      operationId: getRuntimeInfo
      summary: Identity of the runtime and of its workspace
      description: |
        Who answers and on what: the engine version, an identity that changes at every start,
        the workspace it serves, the address it listens on, the watcher, and lightweight
        revisions of the observable resources. Cheap to poll: it reads an in-memory snapshot and
        never scans the workspace nor waits for a scan in progress.

        `workspace.id` identifies the **location** of the workspace: `workspace-v1:` followed by
        the lowercase hexadecimal SHA-256 of the UTF-8 bytes of the compact JSON array
        `[mocksDir, filesDir]`, with the canonical paths reported here (`null` for a missing
        `filesDir`). A folder that does not exist yet is canonicalized through its deepest
        existing ancestor, so the identity does not change once it is created. It does not depend on the desktop root, the port or the start, and it does
        not travel with the files: two runtimes on the same folders share it, with different
        `runtimeId`s.

        `revisions` start at 1 and grow within this runtime when the matching resource changes:
        compare them with the values you saw to know what to read again. They are informative,
        never write preconditions, and may advance more than once for a single action.

        - `catalog`: the collections file, every endpoint file, every variant it lists
          (inactive ones too) and the source and asset each variant references, including files
          that appear, disappear or cannot be read; other files under the mocks folder do not
          count. Reloads, catalog reads and endpoint detail reads update it, and an admin
          mutation publishes it before answering, re-reading exactly the files it wrote. An
          external change that keeps both size and modification time may stay invisible until
          the file is read again.
        - `server`: `serverEnabled` or `proxyAll`.
        - `dump`: the configurable state of the monitor dump (enabled, interval, threshold,
          limits), not its traffic counters.
        - `diagnostics`: status, errors or route availability reported by `GET /runtime/status`,
          not the attempt number alone.
        - `config`: the effective configuration or the set of overrides (`PATCH /config`); a
          patch that changes neither leaves it as it is.
      responses:
        "200":
          description: Runtime identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeInfo" }

  /config:
    get:
      tags: [Runtime]
      operationId: getRuntimeConfig
      summary: Startup, effective and overridden configuration
      description: |
        The nine settings that can change at runtime, as they were at startup and as they are
        now, with the overrides set through `PATCH /config`. No other environment variable is
        exposed: the `/server` switches and the monitor dump options stay on their own routes.
        Nothing here is persisted (`persisted` is always `false`): a restart drops every
        override.
      responses:
        "200":
          description: Effective configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeConfigState" }
    patch:
      tags: [Runtime]
      operationId: patchRuntimeConfig
      summary: Override settings for this run of the engine
      description: |
        Sets or removes ephemeral overrides of the nine runtime settings. The whole body is
        validated before anything changes: an invalid body answers `400` and leaves values,
        overrides and the `config` revision as they were.

        - `set` overrides settings; an override stays explicit even when it equals the startup
          value, until it is unset or the engine restarts. `set.backendUrl: null` disables the
          backend.
        - `unset` removes overrides, so the setting goes back to its startup value (for
          `backendUrl`, the startup backend). Unsetting a setting that has no override succeeds
          and changes nothing.
        - At least one setting must be named; a name may not repeat in `unset` nor appear in
          both. Host, port, folders, the admin API and the watcher cannot change here.

        Each request takes the configuration as it is when it enters serving, before delays,
        matching and the proxy, and keeps it to the end: a request delayed while the backend
        changes still goes to the old one, the next goes to the new one. Open connections
        (proxied WebSockets, streams) are neither moved nor closed. Nothing is written to disk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                set: { $ref: "#/components/schemas/RuntimeConfigOverrides" }
                unset:
                  type: array
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/RuntimeConfigKey" }
            examples:
              slowBackend:
                summary: Point to another backend with a delay on every request
                value: { set: { backendUrl: "http://localhost:8081", globalDelayMs: 1500, delayAllRequests: true } }
              restore:
                summary: Back to the startup values
                value: { unset: [backendUrl, globalDelayMs, delayAllRequests] }
      responses:
        "200":
          description: The configuration after the change, as `GET /config` returns it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeConfigState" }
        "400":
          description: |
            `MUTATION_REJECTED`: invalid body, unknown or immutable setting (`details.key`), or
            invalid value (`details.key`). Nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /runtime/status:
    get:
      tags: [Runtime]
      operationId: getRuntimeStatus
      summary: Outcome of the last load of the workspace
      description: |
        The last completed attempt to load the workspace — at startup, after an admin mutation or
        after a change seen by the watcher — and the per-file errors of the registry currently
        installed. It answers `200` in a degraded or failed state too. Only the last attempt is
        kept, with no history; while a reload runs, the previous attempt stays visible until the
        new one completes.

        - `reasons` lists every cause the attempt served, in the fixed order `startup`, `admin`,
          `watcher`: calls that arrive while a scan is running belong to the next attempt.
        - `errors` are the load errors of the installed registry. `serving: retained` means the
          previous version of that definition is still served; `missing` means nothing serves it.
          A file that loads again leaves the list.
        - `warnings` are problems of the installed registry that do not prevent loading: a
          violation of the script contract seen while loading (a handler or middleware imported
          by another script), or a problem of the script package `mocks/package.json`, such as a
          change that needs a restart. They never change `lastAttempt.status`: an attempt with
          warnings only stays `applied`. Having no warnings is not a statement of full compliance
          with the script contract: `POST /scripts/validate` checks it.
        - A global failure installs nothing: `errors` and `warnings` keep describing the registry
          in use, and `fatalError` reports the failure until the next attempt that installs.
      responses:
        "200":
          description: Load outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeStatus" }

  /scripts/validate:
    post:
      tags: [Runtime]
      operationId: validateWorkspaceScripts
      summary: Check every script of the workspace against the script contract
      description: |
        Loads **every** `*.handler.js` and `*.middleware.js` under the mocks folder — disabled
        endpoints and unselected variants included, which an ordinary reload does not load — with
        the same compilation and resolution the runtime uses, and reports what does not load and
        what violates the script contract.

        - It answers `200` whether or not it finds errors: `ok` is the outcome.
        - `errors` are load failures (`SCRIPT_LOAD_FAILED`, `SCRIPT_INVALID_EXPORT`) and contract
          violations: a local `require` inside a function or in an instance field of a class
          (`SCRIPT_LATE_REQUIRE`), with a computed path (`SCRIPT_DYNAMIC_REQUIRE`) or without an
          extension (`SCRIPT_REQUIRE_WITHOUT_EXTENSION`), a local ES module
          (`SCRIPT_ESM_DEPENDENCY`), a handler or middleware imported by another script
          (`SCRIPT_ENTRYPOINT_IMPORTED`), a helper outside the mocks folder, a nested
          `package.json`, a script package that does not define the standard `#shared/` alias.
          A file that loads but that the contract check cannot analyze is reported as
          `SCRIPT_CONTRACT_NOT_ANALYZED`: it is never certified by omission.
          The runtime tolerates the contract violations and reports only some of them as
          warnings; here they are errors.
        - Loading a script runs its top level, as the runtime does. Nothing is installed: routes,
          `state`, `sharedState`, sequences and open streams are left as they are.
        - The same check is available without a server: `node index.js validate [folder]`.
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptValidationReport" }

  /openapi.yaml:
    get:
      tags: [Runtime]
      operationId: getAdminOpenapi
      summary: This contract, as shipped with the running engine
      description: |
        The OpenAPI description of the version that answers, served as is from the source that
        ships with the engine (`src/admin/admin-api.openapi.yaml`) — in a checkout, the desktop
        app and the development Docker image alike. Same enablement and access rules as every
        other admin route.
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml:
              schema: { type: string }

components:
  requestBodies:
    EmptyJsonObject:
      required: true
      description: An actual non-empty `application/json` payload whose parsed value is exactly `{}`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyJsonObject"
          example: {}
  parameters:
    MockId:
      name: id
      in: path
      required: true
      description: |
        Opaque endpoint id: the endpoint file path relative to the mocks folder, base64url-encoded
        (e.g. `mocks/api/users/GET.endpoint.json`). Read it from a listing; do not build it by hand.
      schema: { type: string }
      example: YXBpL3VzZXJzL0dFVC5lbmRwb2ludC5qc29u
    ResponseFileName:
      name: responseFileName
      in: path
      required: true
      description: Variant file name, as listed in `endpoint.responseFiles`. Must be a bare file name ending in `.response.json`.
      schema: { type: string, pattern: '\.response\.json$' }
      example: 001.response.json
    CollectionId:
      name: id
      in: path
      required: true
      description: Persisted collection id. The virtual `unsorted` bucket is **not** accepted here.
      schema: { type: string }
    CollectionIdWithUnsorted:
      name: id
      in: path
      required: true
      description: Collection id, or `unsorted` for the virtual bucket of unassigned endpoints.
      schema: { type: string }
    DataFileName:
      name: name
      in: path
      required: true
      description: |
        Data file name. Normalized to the canonical form: lowercase, and the `.json` extension is
        optional (`Users.json`, `users.json` and `users` all address the same file).
      schema: { type: string }
      example: users

  responses:
    BadRequest:
      description: |
        Invalid input. On a mutation the body is also rejected when the reload shows that the
        change cannot be applied (`details.code: MUTATION_REJECTED`); `details.rollback` says
        whether anything had to be restored (`not_needed` or `restored`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MutationFailed:
      description: |
        The mutation could not be applied and was undone. `details.code` is
        `RUNTIME_APPLY_FAILED` (the runtime reload failed globally), `MUTATION_FAILED` (an
        unexpected write error) or `ROLLBACK_FAILED` (restoring the previous files or runtime
        failed too, including when an endpoint involved is not served as it was before the
        mutation — no longer served, or still served in the rejected version because the
        restore could not reload it: `details.rollback` is `failed`, and `details.cause` /
        `details.recoveryError` describe both errors — the workspace state must not be assumed
        consistent).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BatchFailed:
      description: |
        The batch did not complete cleanly; the final runtime reload always runs, and
        `details.result` holds the batch result in the shape of the 201 response.

        - `BATCH_RUNTIME_FAILED`: the items were written, but the final reload failed
          globally. Nothing is undone: `runtime.status` is `failed` and every created item is
          `not_applied`.
        - `ROLLBACK_FAILED`: an item's write failed and restoring its files failed too
          (`details.rollback: failed`, with `cause` and `recoveryError`). The batch stops at that
          item: `details.result.items` lists the items processed up to it, and the following
          ones are not attempted. The workspace state must not be assumed consistent. This code
          prevails over a failed final reload.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MockNotFound:
      description: Endpoint (or one of its files) not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StreamEndpointNotServed:
      description: |
        The endpoint does not exist, or the installed runtime does not serve it (disabled, or
        never loaded successfully). An installed middleware endpoint is served with another
        type and answers `400`, not `404`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RevisionConflict:
      description: |
        `details.code: REVISION_CONFLICT`: the resource changed since the draft was read, so
        nothing was written or reloaded. `details.resource` is `{ kind: description, endpointId }`
        or `{ kind: response, endpointId, responseFile }`, with `details.expectedRevision` and
        `details.currentRevision`. Do not retry blindly: read the current version, compare it with
        the draft, then save deliberately with the new revision.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReadInconsistent:
      description: |
        `details.code: READ_INCONSISTENT`, `details.retryable: true`. A file the detail
        references was still missing after a second complete read: the endpoint is changing,
        or a referenced file is missing on disk (the message names it). No partial detail is
        returned. Clients retry automatically at most once.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CollectionNotFound:
      description: Collection not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DataFileNotFound:
      description: Data file not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminApiDisabled:
      description: |
        The admin API is disabled for this runtime (`ADMIN_API_ENABLED`). **Every** route answers
        this way when it is off — it is listed once here rather than repeated on each operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: Admin API disabled
            message: The local mock administration API is disabled for this runtime.
    CollectionList:
      description: The collections after the change.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/CollectionSummary" }
    MockItemList:
      description: The endpoints after the change.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: "#/components/schemas/MockSummary" }
    PushResult:
      description: How many connections received the message.
      content:
        application/json:
          schema:
            type: object
            required: [delivered, connections]
            properties:
              delivered:
                type: integer
                description: Connections the message was written to.
              connections:
                type: integer
                description: Connections currently open on the endpoint.
    ServerState:
      description: The current switches.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ServerState" }

  schemas:
    EmptyJsonObject:
      type: object
      maxProperties: 0
      additionalProperties: false

    EndpointCopyPreview:
      type: object
      required: [dryRun, target, copyResponses, responseFiles, assetFiles, sharedStateRefs, warnings]
      properties:
        dryRun: { type: boolean, const: true }
        target:
          type: object
          required: [method, path]
          properties:
            method: { $ref: "#/components/schemas/HttpMethod" }
            path: { $ref: "#/components/schemas/RoutePath" }
        copyResponses: { type: boolean }
        responseFiles: { type: array, items: { type: string } }
        assetFiles: { type: array, items: { type: string } }
        sharedStateRefs: { type: array, items: { type: string } }
        warnings:
          type: array
          items:
            type: object
            required: [code, names]
            properties:
              code: { type: string, const: SHARED_STATE_REFERENCES_PRESERVED }
              names: { type: array, items: { type: string } }

    SharedStateOrigin:
      type: object
      properties:
        method: { type: string }
        path: { type: string }
        responseFile: { type: string }

    SharedStateSummary:
      type: object
      required: [name, seedKey, status, version, sizeBytes, initializedAt, updatedAt, lastAccessAt, initializedBy, lastAccessedBy]
      properties:
        name: { type: string }
        seedKey: { type: string }
        status: { type: string, enum: [initializing, ready] }
        version: { type: [integer, "null"] }
        sizeBytes: { type: [integer, "null"] }
        initializedAt: { type: [integer, "null"], description: Epoch milliseconds. }
        updatedAt: { type: [integer, "null"], description: Epoch milliseconds. }
        lastAccessAt: { type: [integer, "null"], description: Epoch milliseconds. }
        initializedBy: { $ref: "#/components/schemas/SharedStateOrigin" }
        lastAccessedBy:
          oneOf:
            - { $ref: "#/components/schemas/SharedStateOrigin" }
            - { type: "null" }

    SharedStateList:
      type: object
      required: [items, totalBytes, limits]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SharedStateSummary" } }
        totalBytes: { type: integer, minimum: 0 }
        limits:
          type: object
          required: [maxEntries, maxEntryBytes, maxTotalBytes, maxDepth]
          properties:
            maxEntries: { type: integer }
            maxEntryBytes: { type: integer }
            maxTotalBytes: { type: integer }
            maxDepth: { type: integer }
    # ── Shared primitives ────────────────────────────────────────────────────
    Error:
      type: object
      description: The uniform error shape of the whole admin API.
      required: [error, message]
      properties:
        error:
          type: string
          description: Short label, e.g. `Bad Request`.
        message:
          type: string
          description: Human-readable explanation, safe to show in a UI.
        details:
          type: object
          description: Extra machine-readable context, when the failure has any (e.g. `existingMockId` on a `409` from `POST /mocks`).
          properties:
            code:
              type: string
              description: |
                Stable error code, present on newer errors: `ADMIN_ROUTE_NOT_FOUND`,
                `MUTATION_REJECTED`, `RUNTIME_APPLY_FAILED`, `MUTATION_FAILED`, `ROLLBACK_FAILED`,
                `BATCH_RUNTIME_FAILED`, `READ_INCONSISTENT`, `REVISION_CONFLICT`.
            rollback:
              type: string
              enum: [not_needed, restored, failed]
              description: On a failed mutation, what happened to the files and runtime it had touched.
            cause:
              type: string
              description: "`ROLLBACK_FAILED` only: the error that failed the mutation."
            recoveryError:
              type: string
              description: "`ROLLBACK_FAILED` only: the error that failed the restore."
            retryable:
              type: boolean
              description: "`READ_INCONSISTENT` only: repeating the read may succeed."
            resource:
              type: object
              description: "`REVISION_CONFLICT` only: the protected resource (`kind`, `endpointId`, and `responseFile` for a variant)."
            expectedRevision:
              type: string
              description: "`REVISION_CONFLICT` only: the precondition that was sent."
            currentRevision:
              type: string
              description: "`REVISION_CONFLICT` only: the revision of the current content."
            result:
              type: object
              description: "Batch errors only (`BATCH_RUNTIME_FAILED`, or `ROLLBACK_FAILED` from a batch): the batch result, as in the 201 response."
      example:
        error: Bad Request
        message: config.status must be an integer HTTP status code.

    MonitorEntrySummary:
      type: object
      description: A monitor entry without bodies and headers — exactly these fields.
      required: [id, timestamp, method, path, originalUrl, status, latencyMs, source, matchedRoutePath, sequenceStep, sharedStateError]
      additionalProperties: false
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        method: { type: string }
        path: { type: string }
        originalUrl: { type: string }
        status: { type: integer }
        latencyMs: { type: number }
        source: { type: string }
        matchedRoutePath: { type: [string, "null"] }
        sequenceStep:
          description: The sequence step served, as in the full entry; `null` for other endpoints.
          type: [object, "null"]
        sharedStateError:
          description: Shared-state diagnostics, in the same shape as the full entry; `null` when absent.
          type: [object, "null"]
    MonitorRequestsResponse:
      description: |
        The two shapes of `GET /monitoring/requests`, told apart by their fields: without a query
        only `items`; with `view=page` a `MonitorPage`.
      oneOf:
        - type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              description: Every entry, complete, most recent first.
              items: { $ref: "#/components/schemas/MonitorEntry" }
        - { $ref: "#/components/schemas/MonitorPage" }
    MonitorEntryRead:
      type: object
      required: [runtimeId, item]
      properties:
        runtimeId: { type: string }
        item: { $ref: "#/components/schemas/MonitorEntry" }
    MonitorPage:
      type: object
      required: [items, cursor, hasMore, gap, gapReason, available]
      properties:
        items:
          type: array
          description: Ascending by id; `MonitorEntrySummary` with `fields=summary`, `MonitorEntry` with `fields=full`.
          items:
            anyOf:
              - { $ref: "#/components/schemas/MonitorEntrySummary" }
              - { $ref: "#/components/schemas/MonitorEntry" }
        cursor:
          type: object
          description: Send `since`, `runtimeId` and `generation` back to read the next page.
          required: [runtimeId, generation, since]
          properties:
            runtimeId: { type: string }
            generation: { type: integer, minimum: 1 }
            since: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        hasMore: { type: boolean }
        gap:
          type: boolean
          description: Something between the cursor and this page was lost; empty `items` does not mean "no requests".
        gapReason:
          type: [string, "null"]
          enum: [runtime_changed, cleared, evicted, null]
        available:
          type: object
          required: [oldestId, newestId, highWatermark]
          properties:
            oldestId: { type: [string, "null"] }
            newestId: { type: [string, "null"] }
            highWatermark:
              type: string
              description: The last id assigned in this runtime, `"0"` before the first request.
    RuntimeInfo:
      type: object
      required: [version, runtimeId, startedAt, workspace, listener, watcher, revisions]
      properties:
        version:
          type: string
          description: Version of the package that ships the engine.
        runtimeId:
          type: string
          format: uuid
          description: New at every start of the engine.
        startedAt: { type: string, format: date-time }
        workspace:
          type: object
          required: [id, root, mocksDir, filesDir]
          properties:
            id:
              type: string
              pattern: "^workspace-v1:[0-9a-f]{64}$"
            root:
              type: [string, "null"]
              description: Workspace root known to the desktop app; `null` otherwise.
            mocksDir:
              type: string
              description: Canonical absolute path of the mocks folder.
            filesDir:
              type: [string, "null"]
              description: Canonical absolute path of the data files folder; `null` if none is configured.
        listener:
          description: |
            The address the server actually listens on, also when port 0 was requested; `null`
            only when the engine runs without its own HTTP server.
          anyOf:
            - type: object
              required: [host, port]
              properties:
                host: { type: string }
                port: { type: integer, minimum: 1, maximum: 65535 }
            - type: "null"
        watcher:
          type: object
          required: [state, polling, lastError]
          properties:
            state:
              type: string
              enum: [disabled, starting, ready, error]
            polling:
              type: boolean
              description: Whether the watcher polls instead of using filesystem events.
            lastError: { type: [string, "null"] }
        revisions:
          type: object
          required: [catalog, server, dump, diagnostics, config]
          properties:
            catalog: { type: integer, minimum: 1 }
            server: { type: integer, minimum: 1 }
            dump: { type: integer, minimum: 1 }
            diagnostics: { type: integer, minimum: 1 }
            config: { type: integer, minimum: 1 }
      example:
        version: 1.4.0
        runtimeId: 7d9f1c4e-2b0a-4c7e-9f3a-5e8d2c1b4a60
        startedAt: "2026-09-28T09:14:57.402Z"
        workspace:
          id: workspace-v1:3b1f0c9a8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a3928170605f4e3
          root: /home/me/workspaces/shop
          mocksDir: /home/me/workspaces/shop/mocks
          filesDir: /home/me/workspaces/shop/files
        listener: { host: 127.0.0.1, port: 3000 }
        watcher: { state: ready, polling: false, lastError: null }
        revisions: { catalog: 7, server: 1, dump: 2, diagnostics: 3, config: 1 }
    RuntimeAttempt:
      type: object
      required: [id, startedAt, completedAt, reasons, status]
      properties:
        id:
          type: integer
          minimum: 1
          description: Increasing within this runtime; the startup load is attempt 1.
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        reasons:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [startup, admin, watcher] }
          description: Every cause the attempt served, in the fixed order `startup`, `admin`, `watcher`.
        status:
          type: string
          enum: [applied, degraded, failed]
          description: |
            `applied`: installed without errors. `degraded`: installed, with load errors on some
            files. `failed`: the load failed as a whole and nothing was installed.
    RuntimeLoadError:
      type: object
      required: [endpointId, filePath, message, serving]
      properties:
        endpointId:
          type: [string, "null"]
          description: Id of the endpoint, when the file is an endpoint definition inside the mocks folder.
        filePath:
          type: string
          description: Path relative to the mocks folder, with `/` separators.
        message: { type: string }
        serving:
          type: string
          enum: [retained, missing]
          description: "`retained`: the previous version of the definition is still served. `missing`: nothing serves it."
    RuntimeLoadWarning:
      type: object
      required: [code, endpointId, filePath, message]
      properties:
        code:
          type: string
          description: |
            `SCRIPT_ENTRYPOINT_IMPORTED`, or a `SCRIPT_PACKAGE_*` code about `mocks/package.json`:
            `RESTART_REQUIRED`, `NOT_CREATABLE`, `INCOMPATIBLE`, `INVALID`, `UNREADABLE`.
          examples: [SCRIPT_PACKAGE_RESTART_REQUIRED]
        endpointId:
          type: [string, "null"]
          description: Id of the endpoint, when the warning is about one.
        filePath:
          type: string
          description: Path relative to the mocks folder, with `/` separators.
        message: { type: string }
    ScriptValidationFinding:
      type: object
      required: [code, filePath, message]
      properties:
        code: { type: string, examples: [SCRIPT_LATE_REQUIRE] }
        filePath:
          type: string
          description: Path relative to the mocks folder, with `/` separators.
        line:
          type: integer
          description: 1-based line, when the finding points at a place in the source.
        column:
          type: integer
          description: 1-based column, present with `line`.
        message: { type: string }
    ScriptValidationReport:
      type: object
      required: [ok, mocksDir, scripts, errors, warnings]
      properties:
        ok:
          type: boolean
          description: "`true` when there are no errors; warnings do not change it."
        mocksDir:
          type: string
          description: Canonical absolute path of the mocks folder that was checked.
        scripts:
          type: integer
          description: Number of handler and middleware scripts found.
        errors:
          type: array
          items: { $ref: "#/components/schemas/ScriptValidationFinding" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ScriptValidationFinding" }
      example:
        ok: false
        mocksDir: /workspace/mocks
        scripts: 2
        errors:
          - code: SCRIPT_LATE_REQUIRE
            filePath: users/GET.responses/001.handler.js
            line: 4
            column: 19
            message: "require(\"#shared/users.js\") runs inside a function: import local dependencies at the top of the module, or after a reload the function gets new code in the middle of a request"
        warnings: []
    ScriptContractWarning:
      type: object
      description: A violation of the script contract in a script that was saved anyway.
      required: [code, message]
      properties:
        code: { type: string, examples: [SCRIPT_ENTRYPOINT_IMPORTED] }
        line: { type: integer }
        column: { type: integer }
        message: { type: string }
    RuntimeStatus:
      type: object
      required: [runtimeId, lastAttempt, lastAppliedAttemptId, errors, warnings, fatalError]
      properties:
        runtimeId: { type: string, format: uuid }
        lastAttempt:
          description: |
            The last completed attempt. Always present in a running server, where the startup
            load is the first attempt; `null` only when the engine is embedded without it.
          anyOf:
            - $ref: "#/components/schemas/RuntimeAttempt"
            - type: "null"
        lastAppliedAttemptId:
          type: [integer, "null"]
          description: The last attempt that installed a registry, degraded or not; `null` if none did.
        errors:
          type: array
          items: { $ref: "#/components/schemas/RuntimeLoadError" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/RuntimeLoadWarning" }
        fatalError:
          description: The global failure of the last attempt; `null` once an attempt installs again.
          anyOf:
            - type: object
              required: [message]
              properties:
                message: { type: string }
            - type: "null"
      example:
        runtimeId: 7d9f1c4e-2b0a-4c7e-9f3a-5e8d2c1b4a60
        lastAttempt:
          id: 4
          startedAt: "2026-09-28T09:15:02.118Z"
          completedAt: "2026-09-28T09:15:02.164Z"
          reasons: [admin, watcher]
          status: degraded
        lastAppliedAttemptId: 4
        errors:
          - endpointId: dXNlcnMvR0VULmVuZHBvaW50Lmpzb24
            filePath: users/GET.endpoint.json
            message: "001.handler.js: Unexpected token '{'"
            serving: retained
        warnings: []
        fatalError: null
    RuntimeConfigKey:
      type: string
      enum:
        - backendUrl
        - proxyFallbackEnabled
        - corsEnabled
        - delayAllRequests
        - caseInsensitiveFilters
        - adaptProxyCookies
        - rewriteProxyRedirects
        - globalDelayMs
        - requestTimeoutMs
    RuntimeConfigOverrides:
      type: object
      description: |
        Settings changed at runtime and their values. Stricter than what startup accepts: no
        coercion from strings, integers within the ranges of a Node timer.
      additionalProperties: false
      properties:
        backendUrl:
          type: [string, "null"]
          description: Absolute HTTP/HTTPS URL, validated as at startup; `null` disables the backend.
        proxyFallbackEnabled: { type: boolean }
        corsEnabled: { type: boolean }
        delayAllRequests: { type: boolean }
        caseInsensitiveFilters: { type: boolean }
        adaptProxyCookies: { type: boolean }
        rewriteProxyRedirects: { type: boolean }
        globalDelayMs: { type: integer, minimum: 0, maximum: 2147483647 }
        requestTimeoutMs: { type: integer, minimum: 1, maximum: 2147483647 }
    RuntimeConfig:
      type: object
      description: |
        Values as the engine uses them. At startup they are what the engine accepted, which can
        be looser than the validation of overrides (for example any finite `requestTimeoutMs`).
      additionalProperties: false
      required:
        - backendUrl
        - proxyFallbackEnabled
        - corsEnabled
        - delayAllRequests
        - caseInsensitiveFilters
        - adaptProxyCookies
        - rewriteProxyRedirects
        - globalDelayMs
        - requestTimeoutMs
      properties:
        backendUrl:
          type: [string, "null"]
          description: Absolute HTTP/HTTPS URL of the real backend; `null` when none is configured.
        proxyFallbackEnabled: { type: boolean }
        corsEnabled: { type: boolean }
        delayAllRequests: { type: boolean }
        caseInsensitiveFilters: { type: boolean }
        adaptProxyCookies: { type: boolean }
        rewriteProxyRedirects: { type: boolean }
        globalDelayMs: { type: integer, minimum: 0 }
        requestTimeoutMs:
          type: number
          description: Any finite number accepted at startup (`REQUEST_TIMEOUT_MS`), including `0` and fractions.
    RuntimeConfigState:
      type: object
      required: [runtimeId, startup, effective, overrides, persisted]
      properties:
        runtimeId:
          type: string
          format: uuid
          description: Identity of this start of the engine; a restart gets a new one.
        startup: { $ref: "#/components/schemas/RuntimeConfig" }
        effective: { $ref: "#/components/schemas/RuntimeConfig" }
        overrides:
          allOf:
            - $ref: "#/components/schemas/RuntimeConfigOverrides"
          description: Only the settings changed through `PATCH /config`, including those equal to their startup value.
        persisted:
          const: false
          description: Runtime configuration is never written to disk.
      example:
        runtimeId: 7d9f1c4e-2b0a-4c7e-9f3a-5e8d2c1b4a60
        startup:
          backendUrl: http://localhost:8080
          proxyFallbackEnabled: true
          corsEnabled: true
          delayAllRequests: false
          caseInsensitiveFilters: true
          adaptProxyCookies: true
          rewriteProxyRedirects: true
          globalDelayMs: 0
          requestTimeoutMs: 15000
        effective:
          backendUrl: http://localhost:8080
          proxyFallbackEnabled: true
          corsEnabled: true
          delayAllRequests: false
          caseInsensitiveFilters: true
          adaptProxyCookies: true
          rewriteProxyRedirects: true
          globalDelayMs: 0
          requestTimeoutMs: 15000
        overrides: {}
        persisted: false

    HttpMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]

    RoutePath:
      type: string
      description: |
        Absolute route path. Dynamic segments use the `:param` form (`/api/users/:id`), and a
        path may declare required query parameters. The path determines the folder the endpoint
        files live in, which is why it is immutable after creation.
      example: /api/users/:id

    Headers:
      type: object
      description: Response headers. Values are strings, numbers, booleans, or arrays of strings.
      additionalProperties:
        oneOf:
          - { type: string }
          - { type: number }
          - { type: boolean }
          - { type: array, items: { type: string } }

    ResponseType:
      type: string
      enum: [mock, handler, middleware, sse, ws, sequence]
      description: |
        How a variant answers:
        `mock` static payload · `handler` JS module computing the response ·
        `middleware` JS module transforming a proxied backend response ·
        `sse` Server-Sent Events script · `ws` WebSocket script and rules ·
        `sequence` ordered scenario of mock/handler variants.

    # ── Catalog ──────────────────────────────────────────────────────────────
    MockSummary:
      type: object
      description: One endpoint as it appears in the catalog, summarized through its **selected** variant.
      required: [id, type, configFilePath, method, path, disabled, payloadType, selectedResponseFile, responseTitle, responseCount, sequenceActive]
      properties:
        id:
          type: string
          description: Opaque endpoint id (see the `id` path parameter).
        type: { $ref: "#/components/schemas/ResponseType" }
        configFilePath:
          type: string
          description: Endpoint file path relative to the mocks folder (POSIX separators).
          example: api/users/GET.endpoint.json
        method: { $ref: "#/components/schemas/HttpMethod" }
        path: { $ref: "#/components/schemas/RoutePath" }
        status:
          type: [integer, "null"]
          description: Status of the selected variant; `null` for non-`mock` types.
        disabled:
          type: boolean
          description: True when the endpoint is switched off (it is then ignored by the runtime).
        payloadType:
          type: string
          enum: [json, text, file, none]
          description: Shape of the selected mock payload — `none` for non-`mock` types.
        file:
          type: string
          description: Asset file name, when the selected variant is file-backed.
        delayMs:
          type: integer
          description: Artificial delay of the selected variant (`mock` only).
        selectedResponseFile: { type: string }
        responseTitle:
          type: string
          description: Title of the selected variant (empty string when unnamed).
        responseCount:
          type: integer
          description: How many variants the endpoint owns.
        sequenceActive:
          type: boolean
          description: >-
            True exactly when the selected response variant has `type: sequence`; endpoint
            disablement is exposed separately.
        collectionId:
          type: string
          description: Present only when the endpoint belongs to a collection; absent means the virtual `Unsorted` bucket.

    CollectionSummary:
      type: object
      required: [id, label, itemCount]
      properties:
        id: { type: string }
        label: { type: string }
        itemCount:
          type: integer
          description: Endpoints assigned **directly** to this collection.
        parentId:
          type: string
          description: Present only for nested collections.

    ChildOrder:
      type: object
      description: |
        Display order of each parent's children, endpoints and sub-collections interleaved.
        Keys are `root` (the top-level collections), `unsorted` (endpoints in no collection) or a
        collection id; values are ordered lists of endpoint ids and collection ids.
      additionalProperties:
        type: array
        items: { type: string }
      example:
        root: [authentication, billing]
        authentication: ["YXBpL2xvZ2luL1BPU1QuZW5kcG9pbnQuanNvbg", nested-collection-id]
        unsorted: ["YXBpL3BpbmcvR0VULmVuZHBvaW50Lmpzb24"]

    # ── Endpoint detail ──────────────────────────────────────────────────────
    EndpointConfig:
      type: object
      description: The endpoint file as stored on disk, normalized.
      required: [method, path, description, enabled, responseFiles, selectedResponseFile]
      properties:
        method: { $ref: "#/components/schemas/HttpMethod" }
        path: { $ref: "#/components/schemas/RoutePath" }
        description: { type: string }
        enabled: { type: boolean }
        responseFiles:
          type: array
          items: { type: string }
          description: Variant file names, in creation order.
        selectedResponseFile: { type: string }

    ResponseVariantSummary:
      type: object
      required: [fileName]
      properties:
        fileName: { type: string }
        missing:
          type: boolean
          description: Present and `true` when the file listed in `responseFiles` is not on disk; all other fields are then absent.
        invalid:
          type: boolean
          description: >
            Present and `true` when the file is on disk but cannot be read as a response
            definition. `error` carries the reason and all other fields are then absent: one
            unreadable variant must not make the whole endpoint undiagnosable.
        error:
          type: string
          description: Why the variant could not be read. Present only alongside `invalid`.
        type: { $ref: "#/components/schemas/ResponseType" }
        title: { type: string }
        sourceFile:
          type: string
          description: Module file name (`handler`/`middleware` only).
        status: { type: [integer, "null"] }
        templated:
          type: boolean
          description: "`mock` only: whether placeholders in the payload are rendered per request."
        selected: { type: boolean }

    MockDetailUnavailable:
      type: object
      description: >
        Returned in place of `MockDetail` when a mutation succeeded but its detail could not be
        composed afterwards — the selected variant is unreadable, or an asset or handler source
        was removed by hand. The mutation is committed and the status stays a success status:
        only the description of the result is missing. Re-read the endpoint once it is readable
        again. This shape never comes back from `GET /mocks/{id}`, where an unreadable endpoint
        is a genuine error.
      required: [id, detailUnavailable]
      properties:
        id:
          type: string
          description: Id of the endpoint the mutation was applied to.
        detailUnavailable:
          type: object
          required: [message]
          properties:
            message:
              type: string
              description: Why the detail could not be composed.
        warnings:
          type: array
          description: Only when the mutation saved a script violating the script contract.
          items: { $ref: "#/components/schemas/ScriptContractWarning" }

    RevisionToken:
      type: string
      pattern: "^rev-v1:[0-9a-f]{64}$"
      description: |
        Opaque content revision of a draftable resource: `rev-v1:` and a SHA-256 over the format,
        the workspace, the endpoint, the kind of resource, the variant file name and the covered
        content. A description covers its persisted value; a variant covers its persisted JSON
        definition (key order and indentation do not matter) and the bytes of its direct source
        and asset, names included — not the selection, `enabled`, the description or the variants
        a sequence uses as steps. It describes the current content, not a history: going back to
        the same content gives back the same token, and a restart keeps it. As a precondition,
        only its absence keeps the legacy behaviour: a present but invalid value (`null` or an
        empty header included) is a `400`.
    ResponseVariantCreated:
      description: The endpoint after the mutation, plus the file name of the variant just created.
      allOf:
        - $ref: "#/components/schemas/MockDetailAfterMutation"
        - type: object
          required: [createdResponseFile]
          properties:
            createdResponseFile: { type: string, examples: [003.response.json] }
    ResponseVariantUpdated:
      description: |
        The endpoint after the mutation, plus the file name of the variant that was updated —
        independent of the selected variant the detail describes.
      allOf:
        - $ref: "#/components/schemas/MockDetailAfterMutation"
        - type: object
          required: [updatedResponseFile, updatedResponseRevision]
          properties:
            updatedResponseFile: { type: string, examples: [002.response.json] }
            updatedResponseRevision:
              description: Revision of the updated variant after the write; `null` only if it could not be read back.
              anyOf:
                - $ref: "#/components/schemas/RevisionToken"
                - type: "null"
    ResponseVariant:
      type: object
      required: [id, responseFile, selected, active, response, source, fileInfo, revision]
      properties:
        id: { type: string, description: Endpoint id. }
        responseFile: { type: string }
        selected: { type: boolean }
        active:
          type: boolean
          description: The selected variant, or a step of the selected sequence.
        response:
          type: object
          description: The normalized definition of the variant, as in the `response` of the endpoint detail.
        source:
          type: [string, "null"]
          description: Text of the direct source of a `handler` or `middleware` variant; `null` otherwise.
        revision:
          allOf: [{ $ref: "#/components/schemas/RevisionToken" }]
          description: Revision of this variant, computed from the very data of this response.
        fileInfo:
          description: Name and size of the asset of a file-backed `mock`; `null` otherwise.
          anyOf:
            - type: object
              required: [name, size]
              properties:
                name: { type: string }
                size: { type: integer, minimum: 0 }
            - type: "null"
      example:
        id: dXNlcnMvR0VULmVuZHBvaW50Lmpzb24
        responseFile: 002.response.json
        selected: false
        active: true
        response: { type: mock, title: Empty page, status: 200, headers: {}, delayMs: 0, body: [] }
        source: null
        fileInfo: null
    MockDetailAfterMutation:
      description: >
        The affected endpoint's `MockDetail`, or `MockDetailUnavailable` when the mutation
        succeeded but its detail could not be composed. Tell them apart by the presence of
        `detailUnavailable`.

        When the mutation saved a handler or middleware source that violates the script
        contract, the result also carries `warnings` (a list of `ScriptContractWarning`): the
        script was saved and is served, the warnings say what `POST /scripts/validate` reports as
        errors. The field is absent when there is nothing to report.
      oneOf:
        - $ref: "#/components/schemas/MockDetail"
        - $ref: "#/components/schemas/MockDetailUnavailable"

    MockDetail:
      type: object
      description: |
        Everything about one endpoint: its catalog summary, the definition, the list of variants,
        and the fully expanded **selected** variant. Which of the type-specific groups is present
        depends on `type`:

        - `mock` → `config`, plus `body` (inline payload) **or** `fileInfo` (file-backed);
        - `handler` / `middleware` → `definition`, `source`, `sourceFilePath`;
        - `sse` → `sse`;
        - `ws` → `ws`;
        - `sequence` → `sequence` and `sequenceState`.

        Path fields ending in `FilePath` are **absolute paths on the server machine**, useful for
        local tooling and log correlation; `configFilePath` stays workspace-relative.
      allOf:
        - $ref: "#/components/schemas/MockSummary"
        - type: object
          required: [editable, definitionFilePath, responseFilePath, responses, endpoint, response]
          properties:
            warnings:
              type: array
              description: Only in the result of a mutation that saved a script violating the script contract.
              items: { $ref: "#/components/schemas/ScriptContractWarning" }
            editable:
              type: boolean
              description: Always `true`; kept so a client can render read-only sources uniformly.
            definitionFilePath:
              type: string
              description: Absolute path of the endpoint file.
            responseFilePath:
              type: string
              description: Absolute path of the selected variant file.
            payloadFilePath:
              type: string
              description: Absolute path of what actually carries the payload — the asset, the module source, or the variant file itself.
            responses:
              type: array
              items: { $ref: "#/components/schemas/ResponseVariantSummary" }
            endpoint: { $ref: "#/components/schemas/EndpointConfig" }
            response:
              type: object
              description: The selected variant, normalized. Its fields depend on `type`.
              additionalProperties: true
            descriptionRevision:
              allOf: [{ $ref: "#/components/schemas/RevisionToken" }]
              description: Revision of `endpoint.description`, the precondition of a description draft.
            responseRevision:
              allOf: [{ $ref: "#/components/schemas/RevisionToken" }]
              description: Revision of the selected variant, computed from the very data of this response.
            sequenceState:
              $ref: "#/components/schemas/SequenceState"
            sequence: { $ref: "#/components/schemas/SequenceVariantConfig" }
            config:
              type: object
              description: "`mock` only: the editable configuration of the selected variant."
              properties:
                method: { $ref: "#/components/schemas/HttpMethod" }
                path: { $ref: "#/components/schemas/RoutePath" }
                status: { type: integer }
                disabled: { type: boolean }
                headers: { $ref: "#/components/schemas/Headers" }
                delayMs: { type: integer }
                templated: { type: boolean }
            body:
              description: "`mock` only, inline payloads: the payload itself (any JSON value, or a string for text payloads)."
            fileInfo:
              type: object
              description: "`mock` only, file-backed payloads."
              required: [name, size]
              properties:
                name: { type: string }
                size: { type: integer, description: Size in bytes. }
            definition:
              type: object
              description: "`handler`/`middleware` only."
              properties:
                method: { $ref: "#/components/schemas/HttpMethod" }
                path: { $ref: "#/components/schemas/RoutePath" }
                disabled: { type: boolean }
            source:
              type: string
              description: "`handler`/`middleware` only: the module source code."
            sourceFilePath:
              type: string
              description: "`handler`/`middleware` only: absolute path of the module."
            sse: { $ref: "#/components/schemas/SseConfig" }
            ws: { $ref: "#/components/schemas/WsConfig" }

    # ── Sequences ────────────────────────────────────────────────────────────
    SequenceVariantConfig:
      type: object
      description: |
        A response variant that orders other variants and says how long each one answers.
        Selecting its response file activates it. A step advances after `times` requests or after `forMs` milliseconds
        from its first request — exactly one of the two, except the last step under `onEnd: stay`,
        where no criterion means "stay here forever". At least 2 steps (with one, a sequence would
        just be the plain selection). Only `mock` and `handler` variants can be steps.
      required: [steps, onEnd]
      properties:
        steps:
          type: array
          minItems: 2
          items:
            type: object
            required: [response]
            properties:
              response:
                type: string
                description: A file name listed in `endpoint.responseFiles`.
              times:
                type: integer
                minimum: 1
                description: Advance after this many requests.
              forMs:
                type: integer
                minimum: 1
                description: Advance this long after the step's first request.
        onEnd:
          type: string
          enum: [stay, loop]
          default: stay
        resetAfterMs:
          type: [integer, "null"]
          minimum: 1
          description: Idle time after which the cursor restarts from the first step.

    SequenceState:
      type: object
      description: Live cursor of a sequence. Virgin values (step 0, nothing served) when the endpoint has never been called or the definition changed.
      required: [stepIndex, servedInStep, stepStartedAt, lastRequestAt]
      properties:
        stepIndex:
          type: integer
          description: Step that will answer the **next** request.
        servedInStep: { type: integer }
        stepStartedAt: { type: [integer, "null"], description: Epoch milliseconds. }
        lastRequestAt: { type: [integer, "null"], description: Epoch milliseconds. }

    SequenceStateResponse:
      type: object
      required: [sequenceFile, sequenceState]
      properties:
        sequenceFile:
          type: string
          description: The selected sequence response filename.
        sequenceState:
          oneOf:
            - { $ref: "#/components/schemas/SequenceState" }
            - { type: "null" }

    # ── SSE ──────────────────────────────────────────────────────────────────
    SseMessage:
      type: object
      description: One Server-Sent Event. `data` is required and may be any JSON value or a string.
      required: [data]
      properties:
        data: {}
        event: { type: string, description: Event name; omit for the default `message`. }
        id: { type: string }

    SseConfig:
      type: object
      description: |
        The script an `sse` variant plays for every connection. `afterMs` is relative to the
        **previous** message. An empty script is legitimate: the endpoint stays silent and is
        driven entirely from the console. Under `onEnd: loop` the script must be non-empty and
        contain at least one positive `afterMs`, so the loop cannot spin.
      required: [script, onEnd, presets]
      properties:
        retryMs:
          type: [integer, "null"]
          description: Reconnection hint sent to the client as the SSE `retry:` field.
        script:
          type: array
          items:
            allOf:
              - type: object
                required: [afterMs]
                properties:
                  afterMs: { type: integer, minimum: 0 }
              - $ref: "#/components/schemas/SseMessage"
        onEnd:
          type: string
          enum: [keep-open, close, loop]
          default: keep-open
          description: What happens once the script is exhausted.
        presets:
          type: array
          description: Ready-made messages the console offers for manual pushes.
          items:
            allOf:
              - type: object
                properties:
                  label: { type: string }
              - $ref: "#/components/schemas/SseMessage"

    SseConnection:
      type: object
      required: [id, startedAt, eventsSent, scriptIndex, scriptLength]
      properties:
        id: { type: integer, description: Identifies the connection within this run of the engine. }
        startedAt: { type: integer, description: Epoch milliseconds. }
        eventsSent: { type: integer }
        scriptIndex: { type: integer, description: Position reached in the script. }
        scriptLength: { type: integer }

    SseHistoryEntry:
      type: object
      required: [at, origin, data]
      properties:
        at: { type: integer, description: Epoch milliseconds. }
        origin:
          type: string
          enum: [script, manual]
        connectionId:
          type: integer
          description: The `id` of the connection; absent for broadcasts that were not tied to one connection.
        event: { type: string }
        id: { type: string }
        data: {}

    # ── WebSocket ────────────────────────────────────────────────────────────
    WsMessage:
      type: object
      description: One WebSocket message. Only `data` — `event`/`id` are SSE concepts. Non-string values travel as JSON on the wire.
      required: [data]
      properties:
        data: {}

    WsConfig:
      type: object
      description: |
        What a `ws` variant does: an outgoing script, declarative replies to incoming messages,
        and console presets. An empty script is legitimate (rules and console only). A rule
        matches on exactly one of `equals`, `contains` or `json` (a first-level subset match, no
        logic — when you need more, the right step up is a handler). Unmatched incoming messages
        get no reply; they only appear in the transcript.
      required: [script, onEnd, rules, presets]
      properties:
        script:
          type: array
          items:
            type: object
            required: [afterMs, data]
            properties:
              afterMs: { type: integer, minimum: 0, description: Relative to the previous message. }
              data: {}
        onEnd:
          type: string
          enum: [keep-open, close, loop]
          default: keep-open
        closeCode:
          type: [integer, "null"]
          description: Only when `onEnd` is `close`. Must be 1000 or in the 3000–4999 application range.
        closeReason:
          type: [string, "null"]
          maxLength: 123
          description: Only when `onEnd` is `close` (the protocol caps the close payload at 125 bytes).
        rules:
          type: array
          items:
            type: object
            required: [match, reply]
            properties:
              match:
                type: object
                description: Exactly one of `equals`, `contains`, `json`.
                properties:
                  equals: { type: string }
                  contains: { type: string }
                  json: { type: object }
              reply:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [afterMs, data]
                  properties:
                    afterMs: { type: integer, minimum: 0 }
                    data: {}
        presets:
          type: array
          items:
            type: object
            required: [data]
            properties:
              label: { type: string }
              data: {}

    WsConnection:
      type: object
      required: [id, startedAt, messagesSent, messagesReceived, scriptIndex, scriptLength]
      properties:
        id: { type: integer, description: Identifies the connection within this run of the engine. }
        startedAt: { type: integer, description: Epoch milliseconds. }
        messagesSent: { type: integer }
        messagesReceived: { type: integer }
        scriptIndex: { type: integer }
        scriptLength: { type: integer }

    WsTranscriptEntry:
      type: object
      required: [at, direction, origin, data]
      properties:
        at: { type: integer, description: Epoch milliseconds. }
        direction:
          type: string
          enum: [out, in]
        origin:
          type: string
          enum: [script, rule, manual, received]
        connectionId:
          type: integer
          description: The `id` of the connection; absent for broadcasts that were not tied to one connection.
        data: {}

    # ── Request bodies ───────────────────────────────────────────────────────
    CreateMockRequest:
      oneOf:
        - type: object
          title: Static mock
          description: |
            Creates a `mock` endpoint whose first variant carries an inline payload. The payload
            is stored in the variant file, so `config.bodyFile`/`config.file` are ignored if sent
            — upload a file payload afterwards with
            `PUT /mocks/{id}/responses/{responseFileName}/file`.
          required: [config]
          properties:
            type:
              type: string
              const: mock
              description: Optional; anything other than `handler`/`middleware` creates a mock.
            config:
              type: object
              required: [method, path, status]
              properties:
                method: { $ref: "#/components/schemas/HttpMethod" }
                path: { $ref: "#/components/schemas/RoutePath" }
                status: { type: integer }
                disabled: { type: boolean, default: false }
                headers: { $ref: "#/components/schemas/Headers" }
                delayMs: { type: integer, minimum: 0, default: 0 }
            body:
              description: The payload — any JSON value; a string produces a text payload. Defaults to an empty object.
            description:
              type: string
              description: Endpoint description.
        - type: object
          title: Handler or middleware
          description: Creates a script endpoint. Omitting `source` writes a working scaffold; the module is compiled before the change is committed.
          required: [type, definition]
          properties:
            type:
              type: string
              enum: [handler, middleware]
            definition:
              type: object
              required: [method, path]
              properties:
                method: { $ref: "#/components/schemas/HttpMethod" }
                path: { $ref: "#/components/schemas/RoutePath" }
                disabled: { type: boolean, default: false }
            source:
              type: string
              description: |
                CommonJS module source. A `handler` must export `resolveResponse`, a `middleware`
                must export `transformResponse`. Metadata (`method`, `path`, `disabled`) must
                **not** be exported: it lives in the endpoint file.

    UpdateMockRequest:
      oneOf:
        - type: object
          title: Select the answering variant
          required: [selectedResponseFile]
          properties:
            selectedResponseFile:
              type: string
              description: Must be listed in `endpoint.responseFiles`.
        - type: object
          title: Rewrite the selected mock variant
          required: [config]
          properties:
            type: { type: string, const: mock }
            config:
              type: object
              required: [method, path, status]
              properties:
                method: { $ref: "#/components/schemas/HttpMethod" }
                path:
                  allOf: [{ $ref: "#/components/schemas/RoutePath" }]
                  description: Must equal the current path — it cannot be changed.
                status: { type: integer }
                disabled:
                  type: boolean
                  description: Mirrors the endpoint's `enabled` flag.
                headers: { $ref: "#/components/schemas/Headers" }
                delayMs: { type: integer, minimum: 0 }
                templated: { type: boolean }
            body:
              description: New payload; the current one is kept when absent.
            expectedRevision:
              allOf: [{ $ref: "#/components/schemas/RevisionToken" }]
              description: |
                Optional precondition on the **selected** variant (`responseRevision` of the
                detail). The token includes the file name, so it never authorizes a write on a
                different selection. A protected payload that would also change `enabled` is a
                `400`: change it with `PUT /mocks/{id}/endpoint`.
        - type: object
          title: Rewrite the selected script variant
          required: [type, definition]
          properties:
            type: { type: string, enum: [handler, middleware] }
            definition:
              type: object
              required: [method, path]
              properties:
                method: { $ref: "#/components/schemas/HttpMethod" }
                path:
                  allOf: [{ $ref: "#/components/schemas/RoutePath" }]
                  description: Must equal the current path.
                disabled: { type: boolean }
            source:
              type: string
              description: New module source; a scaffold is written when absent.
            expectedRevision:
              allOf: [{ $ref: "#/components/schemas/RevisionToken" }]
              description: |
                Optional precondition on the **selected** variant (`responseRevision` of the
                detail). The token includes the file name, so it never authorizes a write on a
                different selection. A protected payload that would also change `enabled` is a
                `400`: change it with `PUT /mocks/{id}/endpoint`.

    CreateResponseRequest:
      description: |
        Omit the body (or send only `title`) to clone the selected variant. Send `type` to build a
        fresh variant of that type instead.
      allOf:
        - type: object
          properties:
            select:
              type: boolean
              default: true
              description: "`false` prepares the variant without selecting it: current response and scenario do not change."
        - oneOf:
            - type: object
              title: Clone the selected variant
              properties:
                title: { type: string }
            - type: object
              title: New mock variant
              required: [type]
              properties:
                type: { type: string, const: mock }
                title: { type: string }
                status: { type: integer, default: 200 }
                headers: { $ref: "#/components/schemas/Headers" }
                delayMs: { type: integer, minimum: 0, default: 0 }
                templated: { type: boolean }
                body:
                  description: The payload — any JSON value. Defaults to an empty object.
            - type: object
              title: New handler or middleware variant
              required: [type]
              properties:
                type: { type: string, enum: [handler, middleware] }
                title: { type: string }
                source: { type: string, description: A scaffold is written when absent. }
            - type: object
              title: New SSE variant
              required: [type]
              properties:
                type: { type: string, const: sse }
                title: { type: string }
                retryMs: { type: integer, minimum: 0 }
                script: { $ref: "#/components/schemas/SseConfig/properties/script" }
                onEnd: { type: string, enum: [keep-open, close, loop] }
                presets: { $ref: "#/components/schemas/SseConfig/properties/presets" }
            - type: object
              title: New WebSocket variant
              required: [type]
              properties:
                type: { type: string, const: ws }
                title: { type: string }
                script: { $ref: "#/components/schemas/WsConfig/properties/script" }
                onEnd: { type: string, enum: [keep-open, close, loop] }
                closeCode: { type: integer }
                closeReason: { type: string, maxLength: 123 }
                rules: { $ref: "#/components/schemas/WsConfig/properties/rules" }
                presets: { $ref: "#/components/schemas/WsConfig/properties/presets" }
            - type: object
              title: New sequence variant
              required: [type, steps]
              properties:
                type: { type: string, const: sequence }
                title: { type: string }
                steps: { $ref: "#/components/schemas/SequenceVariantConfig/properties/steps" }
                onEnd: { type: string, enum: [stay, loop], default: stay }
                resetAfterMs: { type: [integer, "null"], minimum: 1 }

    UpdateResponseRequest:
      type: object
      description: |
        Partial update of one variant; absent fields keep their value. The set of meaningful
        fields depends on the variant type — sending a `type` different from the current one is
        rejected.
      properties:
        expectedRevision:
          allOf: [{ $ref: "#/components/schemas/RevisionToken" }]
          description: |
            Optional precondition: the revision of this variant read with the draft (`revision`
            of the variant, or `responseRevision` of the detail for the selected one). A
            mismatch is `409 REVISION_CONFLICT`, with nothing written.
        type: { $ref: "#/components/schemas/ResponseType" }
        title: { type: [string, "null"], description: "`null` clears it." }
        status: { type: integer, description: "`mock` only." }
        headers: { allOf: [{ $ref: "#/components/schemas/Headers" }], description: "`mock` only — replaces the whole map." }
        delayMs: { type: integer, minimum: 0, description: "`mock` only." }
        templated: { type: boolean, description: "`mock` only; not supported on file payloads." }
        body: { description: "`mock` only. Sending it turns a file-backed variant back into an inline one." }
        source: { type: string, description: "`handler`/`middleware` only: the new module source." }
        retryMs: { type: [integer, "null"], description: "`sse` only." }
        script: { type: array, items: {}, description: "`sse`/`ws` only — replaces the whole script." }
        onEnd: { type: string, enum: [keep-open, close, loop, stay], description: "`sse`/`ws`/`sequence` only." }
        presets: { type: array, items: {}, description: "`sse`/`ws` only." }
        closeCode: { type: [integer, "null"], description: "`ws` only; requires `onEnd: close`." }
        closeReason: { type: [string, "null"], description: "`ws` only; requires `onEnd: close`." }
        rules: { type: array, items: {}, description: "`ws` only." }
        steps: { $ref: "#/components/schemas/SequenceVariantConfig/properties/steps" }
        resetAfterMs: { type: [integer, "null"], minimum: 1, description: "`sequence` only; null disables idle reset." }

    # ── OpenAPI import ───────────────────────────────────────────────────────
    OpenapiImportPlan:
      type: object
      description: What a real import would do (`dryRun=true`). Sampled response bodies are omitted from the items.
      required: [items, total, create, skip, collections, prefix]
      properties:
        items:
          type: array
          items:
            type: object
            required: [method, path, status, action]
            properties:
              method: { $ref: "#/components/schemas/HttpMethod" }
              path: { $ref: "#/components/schemas/RoutePath" }
              status:
                type: integer
                description: First successful status declared by the operation.
              collection:
                type: string
                description: First tag of the operation, if any — it becomes the collection.
              action:
                type: string
                enum: [create, skip]
                description: "`skip` when an endpoint with the same method and path already exists."
        total: { type: integer }
        create: { type: integer }
        skip: { type: integer }
        collections:
          type: integer
          description: Distinct tags among the operations that would be created.
        prefix:
          type: string
          description: Prefix actually applied (from the `prefix` query parameter).
        suggestedPrefix:
          type: string
          description: Prefix inferred from the document's `servers`, offered to the user by the wizard.

    BatchRuntime:
      type: object
      description: Outcome of the single runtime reload that closes a batch.
      required: [status, errors]
      properties:
        status:
          type: string
          enum: [applied, degraded]
          description: "`degraded` when some endpoint of the workspace — not necessarily one of this batch — failed to load."
        errors:
          type: array
          items:
            type: object
            required: [filePath, message]
            properties:
              filePath: { type: string, description: "Endpoint file, relative to the mocks folder." }
              message: { type: string }
    BatchItemOutcome:
      type: object
      required: [id, responseFile, writeOutcome, runtimeOutcome, error]
      properties:
        id:
          type: [string, "null"]
          description: Endpoint id, when one was created or already existed.
        responseFile:
          type: [string, "null"]
          description: Response variant written for this item.
        writeOutcome:
          type: string
          enum: [created, skipped, failed]
          description: |
            What happened on disk. A failed item restores its own files and the batch goes on,
            unless the restore fails too: then the batch stops with `500 ROLLBACK_FAILED`.
        runtimeOutcome:
          type: string
          enum: [applied, not_applied, not_applicable]
          description: |
            `applied`: served after the final reload. `not_applied`: written but not served
            (see `error`). `not_applicable`: nothing to serve (skipped or failed).
        error:
          type: [string, "null"]
          description: |
            Why the item failed or is not served. On a created item of the OpenAPI import it can
            also report a collection that could not be assigned: the endpoint stays created.
    CaptureItemOutcome:
      type: object
      description: Outcome of one capture turned into a mock.
      required: [method, path, id, responseFile, writeOutcome, runtimeOutcome, captureOutcome, warnings, error]
      properties:
        method: { type: [string, "null"], description: Destination method; `null` when the capture is unavailable. }
        path: { type: [string, "null"], description: Destination route path; `null` when the capture is unavailable. }
        id:
          type: [string, "null"]
          description: The endpoint created, extended, skipped, or colliding in the derived folder.
        responseFile:
          type: [string, "null"]
          description: The variant written (`001.response.json` for a new endpoint).
        writeOutcome:
          type: string
          enum: [created, variant_added, skipped, failed]
          description: |
            `created`: a new endpoint. `variant_added`: a variant added to an existing one.
            `skipped`: a conflict left untouched, or a capture no longer available. `failed`: see
            `error`; a failed item restores its own files and the batch goes on, unless the restore
            fails too (`500 ROLLBACK_FAILED`).
        runtimeOutcome:
          type: string
          enum: [applied, not_applied, not_applicable]
          description: |
            Checked after the final reload only when the item must be served — a new enabled
            endpoint, or a variant selected on an enabled endpoint. Otherwise `not_applicable`.
        captureOutcome:
          type: string
          enum: [complete, incomplete, unavailable]
        warnings:
          type: array
          description: |
            `INCOMPLETE_CAPTURE` (with `reason`): the draft is not a faithful copy. `SUPERSEDED`
            (with `by`): a later item of the same batch selected another variant on this endpoint,
            so this one is not the one served.
          items:
            oneOf:
              - type: object
                required: [code, reason]
                additionalProperties: false
                properties:
                  code: { const: INCOMPLETE_CAPTURE }
                  reason: { type: string, enum: [truncated, binary] }
              - type: object
                required: [code, by]
                additionalProperties: false
                properties:
                  code: { const: SUPERSEDED }
                  by: { type: string, description: The variant selected by the later item. }
        candidates:
          type: array
          items: { type: string }
          description: The equivalent destinations of an ambiguous conflict.
        error: { type: [string, "null"] }
    OpenapiImportResult:
      type: object
      required: [created, skipped, failed, total, collections, prefix, items, runtime]
      description: |
        The counts keep their historical meaning of writes on disk; whether each endpoint is
        actually served is told by `items[].runtimeOutcome` and `runtime.status`.
      properties:
        created: { type: integer }
        skipped:
          type: integer
          description: Operations whose endpoint already existed.
        failed:
          type: integer
          description: Operations that could not be created — the import does not abort on them.
        total: { type: integer }
        collections:
          type: integer
          description: Collections resolved or created from tags.
        prefix: { type: string }
        items:
          type: array
          description: One outcome per operation of the plan, skipped ones included.
          items:
            allOf:
              - $ref: "#/components/schemas/BatchItemOutcome"
              - type: object
                required: [method, path]
                properties:
                  method: { type: string }
                  path: { type: string }
        runtime: { $ref: "#/components/schemas/BatchRuntime" }

    # ── Data files ───────────────────────────────────────────────────────────
    DataFileSummary:
      type: object
      required: [name, fileName, sizeBytes, updatedAt, usedBy]
      properties:
        name:
          type: string
          description: Canonical name, without extension — the argument of `data("…")`.
        fileName: { type: string }
        sizeBytes: { type: integer }
        updatedAt: { type: string, format: date-time }
        usedBy:
          type: array
          description: Endpoints whose source contains a literal `data("name")`. Best effort — see the route description.
          items:
            type: object
            required: [id, method, path, type]
            properties:
              id: { type: string }
              method: { $ref: "#/components/schemas/HttpMethod" }
              path: { $ref: "#/components/schemas/RoutePath" }
              type: { type: string, enum: [handler, middleware] }

    DataFileDetail:
      allOf:
        - $ref: "#/components/schemas/DataFileSummary"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: The file content as raw text, exactly as stored.

    DataFileRenameResult:
      type: object
      description: The renamed file (without `usedBy`) plus what the reference rewrite touched.
      required: [name, fileName, sizeBytes, updatedAt, referencesRewritten, referencingEndpoints]
      properties:
        name: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer }
        updatedAt: { type: string, format: date-time }
        referencesRewritten:
          type: integer
          description: Literal occurrences rewritten across handler and middleware sources.
        referencingEndpoints:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              method: { $ref: "#/components/schemas/HttpMethod" }
              path: { $ref: "#/components/schemas/RoutePath" }
              type: { type: string, enum: [handler, middleware] }

    # ── Monitoring ───────────────────────────────────────────────────────────
    MonitorEntry:
      type: object
      description: One served request, as captured by the monitor.
      required: [id, timestamp, method, path, status, latencyMs, source]
      properties:
        id: { type: string, description: Sequential id within the process lifetime. }
        timestamp: { type: string, format: date-time, description: When the request started. }
        method:
          type: string
          description: The request method as received — any method the HTTP server accepts (e.g. `M-SEARCH`), not only those a mock can declare.
        path: { type: string, description: "Request path, without query string." }
        originalUrl: { type: string, description: Path with query string. }
        status: { type: integer }
        latencyMs: { type: integer }
        source:
          type: string
          enum: [mock, handler, sse, ws, middleware, backend, mock-only, backend-unconfigured, cors-preflight, proxy]
          description: |
            Which branch answered — the same value the response carries in `x-mock-source`.
            `backend` a plain proxied response · `middleware` a proxied response transformed by a
            middleware · `mock-only` a miss with proxy fallback disabled ·
            `backend-unconfigured` a request that needed the backend while `BACKEND_URL` is unset.
        matchedRoutePath:
          type: string
          description: Route path of the endpoint that matched, when one did (it can differ from `path` for dynamic routes).
        sequenceStep:
          type: object
          description: Present only for endpoints serving a sequence — which step answered.
          properties:
            index: { type: integer }
            count: { type: integer }
            responseFile: { type: string }
            responseTitle: { type: string }
        sharedStateError:
          type: object
          description: Administrative diagnostics for an uncaught shared-state error. Stored values and request bodies are never included.
          required: [code]
          properties:
            code: { type: string }
            name: { type: string }
            requestedSeedKey: { type: string }
            currentSeedKey: { type: string }
            actualBytes: { type: integer }
            limitBytes: { type: integer }
            actualEntries: { type: integer }
            limitEntries: { type: integer }
            actualDepth: { type: integer }
            limitDepth: { type: integer }
            responseFile: { type: string }
        middlewareRoutePath: { type: string }
        middlewareFilePath: { type: string }
        requestHeaders:
          type: object
          description: Sensitive headers are masked as `***`.
          additionalProperties: true
        requestBody:
          type: string
          description: |
            Readable preview: JSON is pretty-printed, compressed payloads are inflated when
            possible, binary ones are described rather than dumped. Absent when there was no body.
        requestBodyBytes: { type: integer, description: "Real size, even when the preview is truncated." }
        requestBodyTruncated: { type: boolean }
        responseHeaders:
          type: object
          additionalProperties: true
        responseBody: { type: string }
        responseBodyBytes: { type: integer }
        responseBodyTruncated: { type: boolean }

    MonitorStreamEvent:
      oneOf:
        - type: object
          title: snapshot
          description: |
            Sent once, right after the stream opens. `runtimeId` is the runtime the entries belong
            to: ids restart at every start, so send it with them (e.g. to
            `POST /monitoring/requests/create-mocks`). A new runtime means a new connection.
          required: [type, items]
          properties:
            type: { type: string, const: snapshot }
            runtimeId: { type: [string, "null"] }
            items:
              type: array
              items: { $ref: "#/components/schemas/MonitorEntry" }
        - type: object
          title: request
          description: A request was served.
          required: [type, item]
          properties:
            type: { type: string, const: request }
            item: { $ref: "#/components/schemas/MonitorEntry" }
        - type: object
          title: clear
          description: The live feed was emptied.
          required: [type]
          properties:
            type: { type: string, const: clear }

    DumpStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        intervalMs: { type: number, description: Flush cadence. }
        threshold: { type: integer, description: Buffered entries that trigger an early flush. }
        maxFileBytes:
          type: integer
          description: Size at which the current file rotates.
        maxTotalBytes:
          type: integer
          description: Size cap of the dump folder; older files are pruned above it. `0` disables pruning.
        currentFile:
          type: [string, "null"]
          description: File being appended to, `null` when the capture is off.
        pendingCount: { type: integer, description: Entries buffered and not yet written. }

    DumpFile:
      type: object
      required: [name, size, mtime]
      properties:
        name: { type: string }
        size: { type: integer, description: Size in bytes. }
        mtime: { type: number, description: "Last modification, epoch milliseconds." }

    DumpEntry:
      allOf:
        - $ref: "#/components/schemas/MonitorEntry"
        - type: object
          required: [dumpKey]
          properties:
            dumpKey:
              type: string
              description: "Stable archive key, `<file>#<lineIndex>` — what `create-mocks` selects on."
              example: dump-2026-08-03T09-12-44-321Z.ndjson#42

    # ── Server state ─────────────────────────────────────────────────────────
    ServerState:
      type: object
      required: [serverEnabled, proxyAll]
      properties:
        serverEnabled:
          type: boolean
          description: When `false` every request is proxied to the backend and nothing is monitored.
        proxyAll:
          type: boolean
          description: When `true` mocks are bypassed but traffic is still monitored.
